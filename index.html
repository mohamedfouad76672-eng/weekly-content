<style>
:root{--bg:#f3f5f4;--surface:#fff;--ink:#10201f;--mute:#5b6b69;--line:#dde4e2;--line2:#c6d1ce;--brand:#0c5551;--on-brand:#fff;--soft:#e2eeec;--soft-ink:#0c5551;--t-theory:#3f6fa8;--t-practical:#b04a63;--t-hospital:#94650e;color-scheme:light}
[data-theme=dark]{--bg:#0d1514;--surface:#131f1e;--ink:#e5edeb;--mute:#8ea2a0;--line:#223331;--line2:#2f4442;--brand:#5cbdb3;--on-brand:#06201d;--soft:rgba(92,189,179,.13);--soft-ink:#86d5cc;--t-theory:#7ea8dc;--t-practical:#e08aa0;--t-hospital:#d9a94a;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.7;min-height:100vh;font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}button{cursor:pointer;background:none;border:0}a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.wrap{max-width:720px;margin-inline:auto;padding-inline:16px}
.i{width:1.1em;height:1.1em;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.mast{padding-top:28px}
.mast-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{font-size:26px;font-weight:700;line-height:1.4}
.sub{color:var(--mute);font-size:14px}
.acts{display:flex;gap:8px;flex:none}
.btn{height:40px;padding-inline:14px;border-radius:10px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px;background:var(--brand);color:var(--on-brand)}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line2)}
.icon-btn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line2);display:grid;place-items:center;color:var(--mute);flex:none}
.icon-btn:hover{color:var(--ink)}.icon-btn.sm{width:34px;height:34px}
.stats{display:flex;flex-wrap:wrap;gap:2px 18px;margin-top:14px;font-size:13.5px;color:var(--mute)}.stats b{color:var(--ink);font-weight:700}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--line);padding:3px;border-radius:12px;margin-top:18px}
.seg button{height:38px;border-radius:9px;font-weight:600;font-size:14px;color:var(--mute)}
.seg button[aria-selected=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.srow{display:flex;gap:8px;margin-top:12px}
.search{position:relative;flex:1}.search .i{position:absolute;inset-inline-start:13px;top:50%;transform:translateY(-50%);color:var(--mute)}
.search input{width:100%;height:44px;border-radius:12px;border:1px solid var(--line2);background:var(--surface);padding-inline:38px 12px}
.search input:focus{outline:2px solid var(--brand);outline-offset:1px}
.srow .btn.ghost{height:44px;border-radius:12px}
.cnt{min-width:20px;height:20px;border-radius:10px;background:var(--brand);color:var(--on-brand);font-size:12px;display:grid;place-items:center;padding-inline:5px}
.filters{margin-top:10px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);display:grid;gap:12px}
.frow{display:flex;gap:10px;align-items:flex-start}.flabel{width:50px;flex:none;font-size:13px;color:var(--mute);padding-top:7px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{height:36px;padding-inline:14px;border-radius:999px;border:1px solid var(--line2);font-size:13px;font-weight:600;color:var(--mute);display:inline-flex;align-items:center;gap:7px}
.pill[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block;flex:none}
.pill .dot{background:var(--tc)}.pill[aria-pressed=true] .dot{background:currentColor}
.weeknav{position:sticky;top:0;z-index:20;margin-top:18px;background:var(--bg);background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.weekrow{display:flex;align-items:center;gap:10px;padding-top:10px}.weekrow>span{font-size:13px;color:var(--mute);flex:none}
.weeks{display:flex;gap:6px;overflow-x:auto;flex:1;scrollbar-width:none}.weeks::-webkit-scrollbar{display:none}
.wk{flex:none;width:36px;height:36px;border-radius:10px;border:1px solid var(--line2);font-weight:600;color:var(--mute)}
.wk[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.days{display:grid;grid-template-columns:repeat(6,1fr);margin-top:4px}
.day{position:relative;height:42px;font-size:13.5px;font-weight:600;color:var(--mute);white-space:nowrap}
.day[aria-pressed=true]{color:var(--ink)}.day[aria-pressed=true]::after{content:"";position:absolute;inset-inline:8px;bottom:0;height:2px;border-radius:2px;background:var(--brand)}
.today{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--brand);margin-inline-start:4px;vertical-align:middle}
main{padding-block:8px 72px}
.group{margin-top:22px}.group-h{display:flex;align-items:baseline;gap:8px;padding:0 4px 8px}.group-h h2{font-size:16px;font-weight:700}.group-h span{font-size:13px;color:var(--mute)}
.panel,.subj{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
main>.panel{margin-top:16px}
.lec{position:relative;padding:14px 18px;border-top:1px solid var(--line)}.lec:first-child{border-top:0}
.lec::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:3px;background:var(--tc)}
.lec-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.lec-tag{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--tc)}.ctx{color:var(--mute);font-weight:500}
.lec-title{font-size:16px;font-weight:600;line-height:1.5;margin-top:2px}
.lec-meta{display:flex;flex-wrap:wrap;gap:2px 16px;font-size:13px;color:var(--mute);margin-top:2px}.lec-meta span{display:inline-flex;align-items:center;gap:6px}
.res{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding-inline:11px;border-radius:9px;font-size:13px;font-weight:600;background:var(--soft);color:var(--soft-ink)}
a.chip:hover{box-shadow:inset 0 0 0 1px var(--brand)}
.chip.off{background:none;color:var(--mute);border:1px dashed var(--line2);font-weight:500;opacity:.6}
.chip.book{background:none;border:1px solid var(--line2);color:var(--ink)}
.subj{margin-top:10px}.subj>summary{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;list-style:none}.subj>summary::-webkit-details-marker{display:none}
.subj-t{flex:1;min-width:0}.subj-n{display:block;font-size:16px;font-weight:600;line-height:1.5}
.subj-types{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:2px}.stype{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--tc)}
.subj-c{font-size:13px;color:var(--mute);white-space:nowrap}.chev{color:var(--mute);transition:transform .2s}.subj[open] .chev{transform:rotate(180deg)}
.subj[open]>summary{border-bottom:1px solid var(--line)}
.subj-book{display:flex;align-items:center;gap:8px;padding:10px 16px;font-size:13px;font-weight:600;color:var(--soft-ink);background:var(--soft);border-bottom:1px solid var(--line)}
.empty{text-align:center;padding:48px 16px}.empty b{display:block;font-size:16px}.empty p{color:var(--mute);margin:4px 0 16px}
.loading{display:grid;gap:10px;padding-top:16px;color:var(--mute);font-size:13.5px}
.loading i{display:block;height:92px;border-radius:14px;background:var(--line);opacity:.55;animation:p 1.4s ease-in-out infinite}
@keyframes p{50%{opacity:.25}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,8px);max-width:90%;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:30}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:640px){h1{font-size:30px}.mast{padding-top:44px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

<header class="mast wrap">
  <div class="mast-row">
    <div><h1>بوابة العلاج الطبيعي</h1><p class="sub">الفرقة الرابعة، الفصل الدراسي الأول</p></div>
    <div class="acts">
      <button id="todayBtn" class="btn">محاضرات اليوم</button>

<script>
const SHEET_ID = '1JqxzBRGmDWjUuQgCCaaExbyh96zmWAdXlL9-pFellqY';
const WEEKS = 14;
const DAYS = [
  { k: 'sat', n: 'السبت' },
  { k: 'sun', n: 'الأحد' },
  { k: 'mon', n: 'الإثنين' },
  { k: 'tue', n: 'الثلاثاء' },
  { k: 'wed', n: 'الأربعاء' }
];
const TODAY_MAP = { 0: 'sun', 1: 'mon', 2: 'tue', 3: 'wed', 6: 'sat' };
const TODAY = TODAY_MAP[new Date().getDay()] || 'sat';

const TYPES = [
  { k: 'نظري', v: '--t-theory' },
  { k: 'عملي', v: '--t-practical' },
  { k: 'مستشفى', v: '--t-hospital' }
];

const RES = [
  { k: 'audio', l: 'استماع للريكورد', i: 'headphones', pill: 'متاح ريكورد' },
  { k: 'pdf', l: 'عرض الداتا', i: 'file', pill: 'متاحة داتا' },
  { k: 'summary', l: 'الملخص', i: 'list', pill: null },
  { k: 'transcript', l: 'التفريغ', i: 'text', pill: 'متاح تفريغ' },
  { k: 'quiz', l: 'بنك الأسئلة', i: 'quiz', pill: 'متاح بنك أسئلة' }
];

// روابط مجلدات الكتب ومواصفات المحتوى المتاح لكل مادة
const SUBJECT_CONFIG = {
  "P.T. for Surgery & Burns": {
    url: "https://drive.google.com/drive/folders/1rjzM4ujaowyxsckjmTjge_UVvJ1qpdfw",
    types: ["نظري", "عملي", "مستشفى"]
  },
  "P.T. for Surgery": {
    url: "https://drive.google.com/drive/folders/1rjzM4ujaowyxsckjmTjge_UVvJ1qpdfw",
    types: ["عملي", "مستشفى"]
  },
  "P.T. for Burns": {
    url: "https://drive.google.com/drive/folders/1rjzM4ujaowyxsckjmTjge_UVvJ1qpdfw",
    types: ["عملي", "مستشفى"]
  },
  "P.T. for Women's Health": {
    url: "https://drive.google.com/drive/folders/1wDijakf-aLTelHirAOvMHvhANAws2kFv",
    types: ["نظري", "عملي", "مستشفى"]
  },
  "P.T. for Female Pelvic Disorders": {
    url: "https://drive.google.com/drive/folders/1Y6fbWpXBx0H0J1ZrcbKnQF05t77JHlfU",
    types: ["نظري", "مستشفى"]
  },
  "P.T. for Integumentary": {
    url: "https://drive.google.com/drive/folders/12ephKkEgw-1tTMbsxriLDvW0N3KpGuX8",
    types: ["نظري", "مستشفى"]
  },
  "Ergonomics & Work Mechanics": {
    url: "https://drive.google.com/drive/folders/1LTOyqqQYOQFU25oa7efM6po6yfhUCvfJ",
    types: ["نظري", "عملي"]
  },
  "General Surgery & Burns": {
    url: "https://drive.google.com/drive/folders/1OmWCBW2dSecijWiAR0n6RK0QV7fUAOmR",
    types: ["نظري"]
  },
  "Obstetrics & Gynecology": {
    url: "https://drive.google.com/drive/folders/1GROsrh5PeIupkKwFFyJpIgqsX9EnMYfA",
    types: ["نظري"]
  },
  "Dermatology": {
    url: "https://drive.google.com/drive/folders/15Ntua6_yw0nEcG5Rv_lDToteGZkLUh6B",
    types: ["نظري"]
  }
};
const DEFAULT_BOOKS_FOLDER = "https://drive.google.com/drive/folders/1nc0vXWqaD9wV2y-yYfVkwi1VEHIraBBW";

function getSubjectConfig(subj) {
  return SUBJECT_CONFIG[subj] || { url: DEFAULT_BOOKS_FOLDER, types: ["نظري"] };
}

const $ = id => document.getElementById(id);
const isUrl = u => /^https?:\/\//i.test(u || '');
const store = {
  get: (k, f) => { try { return localStorage.getItem(k) ?? f; } catch (e) { return f; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} }
};
const sess = {
  get: k => { try { return JSON.parse(sessionStorage.getItem(k)); } catch (e) { return null; } },
  set: (k, v) => { try { sessionStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

let ALL = [], VIEW = [];
let st = {
  view: store.get('pt_view', 'week'),
  week: Math.min(WEEKS, Math.max(1, +store.get('pt_week', 1) || 1)),
  day: 'all',
  type: 'all',
  res: new Set(),
  q: ''
};

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ic = n => `<svg class="i" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const typeMeta = t => TYPES.find(x => x.k === t) || { k: t, v: '--mute' };

function fetchWeek(n) {
  const key = 'ptw_' + n;
  const cached = sess.get(key);
  if (cached) return Promise.resolve(cached);

  return new Promise(resolve => {
    const cb = 'gviz_callback_' + n + '_' + Math.random().toString(36).substring(2, 9);
    const sheetName = 'Week ' + String(n).padStart(2, '0');
    const script = document.createElement('script');

    let isDone = false;
    const cleanup = () => {
      isDone = true;
      if (window[cb]) delete window[cb];
      if (script.parentNode) script.remove();
    };

    const timeout = setTimeout(() => {
      if (!isDone) {
        cleanup();
        resolve(null);
      }
    }, 10000);

    window[cb] = function(resp) {
      clearTimeout(timeout);
      try {
        const rows = ((resp && resp.table && resp.table.rows) || []).map(row => {
          const c = row.c || [];
          const v = i => (c[i] && c[i].v != null) ? String(c[i].v).trim() : '';
          return {
            wk: n,
            day: v(0),
            subject: v(1),
            type: v(2),
            place: v(3),
            time: v(4),
            audio: v(5),
            pdf: v(6),
            summary: v(7),
            transcript: v(8),
            quiz: v(9),
            dayKey: (v(10) || '').toLowerCase()
          };
        }).filter(x => x.subject);

        sess.set(key, rows);
        cleanup();
        resolve(rows);
      } catch (err) {
        cleanup();
        resolve(null);
      }
    };

    script.onerror = function() {
      clearTimeout(timeout);
      cleanup();
      resolve(null);
    };

    script.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?sheet=${encodeURIComponent(sheetName)}&tqx=responseHandler:${cb}`;
    document.body.appendChild(script);
  });
}

async function loadAll(force) {
  if (force) {
    for (let i = 1; i <= WEEKS; i++) sessionStorage.removeItem('ptw_' + i);
  }
  $('loading').hidden = false;

  const currentWeekData = await fetchWeek(st.week);
  if (currentWeekData && currentWeekData.length) {
    ALL = [...currentWeekData];
    $('loading').hidden = true;
    renderStats();
    render();
  }

  const otherWeeksPromises = Array.from({ length: WEEKS }, (_, i) => i + 1)
    .filter(n => n !== st.week)
    .map(n => fetchWeek(n));

  const otherResults = await Promise.all(otherWeeksPromises);
  const combined = [
    ...(currentWeekData || []),
    ...otherResults.filter(Boolean).flat()
  ];

  if (combined.length) {
    ALL = combined;
  }

  $('loading').hidden = true;
  renderStats();
  render();
}

function matches(it, ignoreDay) {
  if (st.type !== 'all' && it.type !== st.type) return false;
  for (const r of st.res) {
    if (!isUrl(it[r])) return false;
  }
  if (!ignoreDay && st.view === 'week' && st.day !== 'all' && it.dayKey !== st.day) return false;
  if (st.q) {
    const hay = (it.subject + ' ' + it.place + ' ' + it.day).toLowerCase();
    if (!hay.includes(st.q.toLowerCase())) return false;
  }
  return true;
}

function copyItem(it) {
  let t = `📌 *${it.subject}*\n${it.type || ''} — ${it.day || ''} ${it.time || ''}\n📍 ${it.place || ''}\n`;
  RES.forEach(r => {
    if (isUrl(it[r.k])) t += `${r.i} ${r.l}: ${it[r.k]}\n`;
  });
  const cfg = getSubjectConfig(it.subject);
  if (cfg.url) t += `📚 كتب المادة ومذكراتها: ${cfg.url}\n`;

  const ok = () => toast('تم نسخ تفاصيل المحاضرة للمشاركة');
  (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(ok, () => {
    const x = document.createElement('textarea');
    x.value = t;
    document.body.appendChild(x);
    x.select();
    try { document.execCommand('copy'); ok(); } catch (e) {}
    x.remove();
  });
}

function toast(m) {
  const e = $('toast');
  e.textContent = m;
  e.classList.add('show');
  clearTimeout(toast.t);
  toast.t = setTimeout(() => e.classList.remove('show'), 2200);
}

function toTop() {
  const y = $('content').offsetTop - (st.view === 'week' ? $('weekNav').offsetHeight : 0) - 8;
  if (scrollY > y) scrollTo({ top: Math.max(0, y) });
}

const hasFilters = () => st.q || st.type !== 'all' || st.res.size || (st.view === 'week' && st.day !== 'all');

function emptyHTML() {
  if (!$('loading').hidden) return '';
  const loaded = ALL.length > 0;
  return `<div class="empty"><b>${loaded ? 'لا توجد محاضرات مطابقة' : 'تعذّر تحميل الجدول'}</b>
    <p>${loaded ? 'جرّب أسبوعًا أو يومًا آخر، أو غيّر البحث والتصفية.' : 'تأكد من الاتصال بالإنترنت ثم أعد المحاولة.'}</p>
    ${loaded ? (hasFilters() ? '<button class="btn ghost" data-act="clear">إزالة كل التصفيات</button>' : '') : '<button class="btn" data-act="retry">إعادة المحاولة</button>'}</div>`;
}

function resChip(it, r) {
  const url = it[r.k];
  if (!isUrl(url)) return `<span class="chip off" title="لم يتم رفعه بعد" aria-label="${r.l} (غير متاح بعد)">${ic(r.i)}${r.l}</span>`;
  return `<a class="chip" href="${esc(url)}" target="_blank" rel="noopener">${ic(r.i)}${r.l}</a>`;
}

function cardHTML(it, ctx, showBook) {
  VIEW.push(it);
  const tm = typeMeta(it.type);
  const cfg = getSubjectConfig(it.subject);
  const bookLabel = it.type === 'عملي' ? 'مذكرة العملي' : (it.type === 'مستشفى' ? 'شيت المستشفى' : 'كتاب المادة');
  return `<article class="lec" data-i="${VIEW.length - 1}" style="--tc:var(${tm.v})">
    <div class="lec-head">
      <div style="min-width:0">
        <p class="lec-tag"><i class="dot"></i>${esc(it.type || '—')}${ctx ? `<span class="ctx">${esc(ctx)}</span>` : ''}</p>
        <h3 class="lec-title"><bdi>${esc(it.subject)}</bdi></h3>
        <p class="lec-meta"><span>${ic('pin')}<bdi>${esc(it.place || '—')}</bdi></span><span>${ic('clock')}<bdi>${esc(it.time || '—')}</bdi></span></p>
      </div>
      <button class="icon-btn sm copyBtn" title="نسخ للمشاركة" aria-label="نسخ تفاصيل المحاضرة للمشاركة">${ic('share')}</button>
    </div>
    <div class="res">${RES.map(r => resChip(it, r)).join('')}${showBook ? `<a class="chip book" href="${esc(cfg.url)}" target="_blank" rel="noopener">${ic('book')}${bookLabel}</a>` : ''}</div>
  </article>`;
}

function render() {
  $('weekNav').hidden = st.view !== 'week';
  document.querySelectorAll('.viewBtn').forEach(b => b.setAttribute('aria-selected', b.dataset.view === st.view));
  const n = (st.type !== 'all' ? 1 : 0) + st.res.size;
  $('filterCount').hidden = !n;
  $('filterCount').textContent = n;
  VIEW = [];
  st.view === 'week' ? renderWeek() : renderSubjects();
}

function renderWeek() {
  document.querySelectorAll('.wk').forEach(b => b.setAttribute('aria-pressed', +b.dataset.w === st.week));
  document.querySelectorAll('.day').forEach(b => b.setAttribute('aria-pressed', b.dataset.d === st.day));
  document.querySelector('.wk[aria-pressed=true]')?.scrollIntoView({ inline: 'center', block: 'nearest' });

  const items = ALL.filter(it => it.wk === st.week && matches(it));
  const root = $('content');
  if (!items.length) { root.innerHTML = emptyHTML(); return; }
  if (st.day !== 'all') {
    root.innerHTML = `<div class="panel">${items.map(it => cardHTML(it, '', true)).join('')}</div>`;
    return;
  }
  const known = DAYS.map(d => d.k);
  const groups = DAYS.map(d => ({ n: d.n, rows: items.filter(x => x.dayKey === d.k) }));
  groups.push({ n: 'بدون يوم محدد', rows: items.filter(x => !known.includes(x.dayKey)) });
  root.innerHTML = groups.filter(g => g.rows.length).map(g => {
    const extra = g.rows[0].day && g.rows[0].day !== g.n && g.n !== 'بدون يوم محدد' ? g.rows[0].day : '';
    return `<section class="group"><div class="group-h"><h2>${g.n}</h2><span>${extra ? esc(extra) + '، ' : ''}${g.rows.length} محاضرة</span></div>
      <div class="panel">${g.rows.map(it => cardHTML(it, '', true)).join('')}</div></section>`;
  }).join('');
}

function renderSubjects() {
  const bySubject = {};
  ALL.filter(it => matches(it, true)).forEach(it => (bySubject[it.subject] ??= []).push(it));
  const subjects = Object.keys(bySubject).sort((a, b) => a.localeCompare(b));
  const root = $('content');
  if (!subjects.length) { root.innerHTML = emptyHTML(); return; }
  const open = (st.q || st.type !== 'all' || st.res.size) ? ' open' : '';

  root.innerHTML = subjects.map(sub => {
    const rows = bySubject[sub].sort((a, b) => a.wk - b.wk);
    const cfg = getSubjectConfig(sub);
    const types = (cfg.types || ['نظري']).map(t => `<span class="stype" style="--tc:var(${typeMeta(t).v})"><i class="dot"></i>${esc(t)}</span>`).join('');
    return `<details class="subj"${open}>
      <summary><span class="subj-t"><span class="subj-n"><bdi>${esc(sub)}</bdi></span><span class="subj-types">${types}</span></span>
        <span class="subj-c">${rows.length} محاضرة</span>${ic('chev').replace('class="i"', 'class="i chev"')}</summary>
      <a class="subj-book" href="${esc(cfg.url)}" target="_blank" rel="noopener">${ic('book')}كتب ومذكرات المادة</a>
      <div>${rows.map(it => cardHTML(it, `الأسبوع ${it.wk}، ${it.day}`, false)).join('')}</div>
    </details>`;
  }).join('');
}

function renderStats() {
  $('statLec').textContent = ALL.length;
  $('statTr').textContent = ALL.filter(x => isUrl(x.transcript)).length;
  $('statQ').textContent = ALL.filter(x => isUrl(x.quiz)).length;
}

function renderPills() {
  $('typePills').innerHTML = ['all', ...TYPES.map(t => t.k)].map(t => {
    const tm = t === 'all' ? null : typeMeta(t);
    return `<button class="pill" data-t="${t}" aria-pressed="${st.type === t}"${tm ? ` style="--tc:var(${tm.v})"` : ''}>${tm ? '<i class="dot"></i>' : ''}${tm ? t : 'الكل'}</button>`;
  }).join('');
  $('resPills').innerHTML = RES.filter(r => r.pill).map(r =>
    `<button class="pill" data-r="${r.k}" aria-pressed="${st.res.has(r.k)}">${ic(r.i)}${r.pill}</button>`).join('');
}

async function selectWeek(i) {
  st.week = i;
  store.set('pt_week', i);
  render();
  toTop();
  if (!ALL.some(x => x.wk === i)) {
    $('loading').hidden = false;
    const w = await fetchWeek(i);
    if (w) { ALL = [...ALL.filter(x => x.wk !== i), ...w]; renderStats(); }
    $('loading').hidden = true;
    render();
  }
}

function clearAll() {
  st.q = ''; $('search').value = ''; st.type = 'all'; st.res.clear(); st.day = 'all';
  renderPills(); render();
}

$('weekPills').innerHTML = Array.from({ length: WEEKS }, (_, i) => `<button class="wk" data-w="${i + 1}" aria-label="الأسبوع ${i + 1}">${i + 1}</button>`).join('');
$('weekPills').onclick = e => { const b = e.target.closest('.wk'); if (b) selectWeek(+b.dataset.w); };
$('dayTabs').innerHTML = [{ k: 'all', n: 'الكل' }, ...DAYS].map(d =>
  `<button class="day" data-d="${d.k}">${d.n}${d.k === TODAY ? '<i class="today"></i><span class="sr"> (اليوم)</span>' : ''}</button>`).join('');
$('dayTabs').onclick = e => { const b = e.target.closest('.day'); if (b) { st.day = b.dataset.d; render(); toTop(); } };

$('typePills').onclick = e => { const b = e.target.closest('[data-t]'); if (b) { st.type = b.dataset.t; renderPills(); render(); } };
$('resPills').onclick = e => {
  const b = e.target.closest('[data-r]'); if (!b) return;
  st.res.has(b.dataset.r) ? st.res.delete(b.dataset.r) : st.res.add(b.dataset.r);
  renderPills(); render();
};
$('filterBtn').onclick = () => {
  const p = $('filters'); p.hidden = !p.hidden;
  $('filterBtn').setAttribute('aria-expanded', String(!p.hidden));
};
$('content').addEventListener('click', e => {
  const c = e.target.closest('.copyBtn');
  if (c) { const it = VIEW[+c.closest('article').dataset.i]; if (it) copyItem(it); return; }
  const a = e.target.closest('[data-act]');
  if (a) a.dataset.act === 'clear' ? clearAll() : loadAll(true);
});

document.querySelectorAll('.viewBtn').forEach(b => b.onclick = () => {
  st.view = b.dataset.view;
  store.set('pt_view', st.view);
  render();
});

$('search').oninput = e => {
  clearTimeout($('search')._t);
  const v = e.target.value;
  $('search')._t = setTimeout(() => { st.q = v; render(); }, 250);
};

$('todayBtn').onclick = () => {
  st.view = 'week';
  st.day = TODAY;
  store.set('pt_view', 'week');
  render();
  toTop();
};

function applyTheme(t, persist) {
  document.documentElement.dataset.theme = t;
  $('themeUse').setAttribute('href', t === 'dark' ? '#i-sun' : '#i-moon');
  $('themeBtn').setAttribute('aria-label', t === 'dark' ? 'التبديل إلى الوضع الفاتح' : 'التبديل إلى الوضع الداكن');
  document.querySelector('meta[name=theme-color]').content = t === 'dark' ? '#0d1514' : '#f3f5f4';
  if (persist) store.set('pt_theme', t);
}
$('themeBtn').onclick = () => applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark', true);

applyTheme(document.documentElement.dataset.theme || 'light');
renderPills();
render();
loadAll();
</script>
</body>
</html>
