<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f2f4f5">
<title>دليل المحاضرات والمحتوى | كلية العلاج الطبيعي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<script>
(function(){try{var l=localStorage.getItem('PT_LANG')||'ar',t=localStorage.getItem('PT_THEME');
if(!t)t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
var d=document.documentElement;d.lang=l;d.dir=l==='ar'?'rtl':'ltr';d.dataset.theme=t;}catch(e){}})();
</script>
<style>
:root{--bg:#f2f4f5;--card:#fff;--ink:#1a2024;--mute:#5f6b73;--line:#dde2e5;--acc:#0e6e6a;--on:#fff;--soft:#e8f1f0;--L:#3b62a8;--C:#b0620f;--B:#7b4a8f;--pad:16px}
[data-theme=dark]{--bg:#0e1113;--card:#161a1d;--ink:#e8eaeb;--mute:#8b969c;--line:#252b2f;--acc:#4db3aa;--on:#08201e;--soft:#14262a;--L:#7c9fe0;--C:#e0964a;--B:#b98ad0}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
body{font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;min-height:100dvh;-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding-inline:var(--pad)}
.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
button,a{-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px}
h1{font-size:1.125rem;font-weight:600;line-height:1.4}
.sub{font-size:.8125rem;color:var(--mute)}
.tools{display:flex;gap:2px;flex:none}
.ib{min-width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;background:none;color:var(--mute);border-radius:10px;font:inherit;font-size:.8125rem;font-weight:500;cursor:pointer}
.ib:hover{background:var(--soft);color:var(--ink)}
.ib.txt{padding:0 12px;color:var(--acc)}
.admin{display:none;align-items:center;justify-content:space-between;border-top:1px solid var(--line);font-size:.8125rem}
.admin.on{display:flex}
.admin a,.admin button{color:var(--acc);font:inherit;font-weight:500;background:none;border:0;cursor:pointer;text-decoration:none;min-height:44px;display:inline-flex;align-items:center}

.nav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.wk-h{display:flex;justify-content:space-between;align-items:baseline;font-size:.8125rem;color:var(--mute);padding-top:8px}
.wk-h b{color:var(--ink);font-weight:600}
.weeks{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x proximity;padding:8px var(--pad) 10px;margin-inline:calc(var(--pad)*-1);scrollbar-width:none}
.weeks::-webkit-scrollbar{display:none}
.wk{flex:none;width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--mute);font:inherit;font-weight:500;font-variant-numeric:tabular-nums;cursor:pointer;scroll-snap-align:center}
.wk[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.days{display:grid;grid-template-columns:repeat(5,1fr)}
.day{height:48px;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;background:none;color:var(--mute);font:inherit;font-size:.9375rem;font-weight:500;cursor:pointer}
.day[aria-selected=true]{color:var(--ink);font-weight:600;border-color:var(--acc)}
.today span::after{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--acc);margin-inline-start:5px;vertical-align:middle}
.loading .nav{border-bottom-color:var(--acc);animation:pulse 1s infinite}

main{padding-block:18px 48px}
.dh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;min-height:44px}
h2{display:inline;font-size:1.0625rem;font-weight:600}
.cnt{font-size:.8125rem;color:var(--mute);margin-inline-start:8px}
.msg{font-size:.8125rem;color:var(--C);margin-bottom:10px}

.list{display:grid;gap:12px;align-items:start}
.lec{display:grid;grid-template-columns:68px 1fr;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.lec[data-t=L]{--c:var(--L)}.lec[data-t=C]{--c:var(--C)}.lec[data-t=B]{--c:var(--B)}
.time{padding:14px 0;text-align:center;direction:ltr;border-inline-end:1px solid var(--line);font-variant-numeric:tabular-nums}
.time b{display:block;font-size:1rem;font-weight:600}
.time span{font-size:.75rem;color:var(--mute)}
.body{padding:14px 16px;min-width:0}
.tag{display:flex;align-items:center;gap:6px;font-size:.75rem;font-weight:500;color:var(--c)}
.tag i{width:7px;height:7px;border-radius:50%;background:var(--c)}
h3{font-size:1rem;font-weight:600;line-height:1.5;margin:2px 0 4px}
.meta{display:flex;align-items:flex-start;gap:6px;font-size:.8125rem;color:var(--mute)}
.meta .i{width:15px;height:15px;margin-top:4px}

.acts{display:grid;grid-template-columns:repeat(auto-fit, minmax(130px, 1fr));gap:6px;margin-top:12px}
.btn{min-height:38px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 10px;border-radius:8px;border:1px solid var(--line);color:var(--mute);font-size:.8125rem;font-weight:500;text-decoration:none;transition:0.15s}
.btn .i{width:16px;height:16px}
.btn.act-audio{border-color:var(--acc);color:var(--acc);background:var(--soft)}
.btn.act-pdf{border-color:#3b62a8;color:#3b62a8;background:#ebf1fa}
[data-theme=dark] .btn.act-pdf{background:#132038;color:#8ab4f8;border-color:#2a3d60}
.btn.act-sum{border-color:#b0620f;color:#b0620f;background:#fdf4eb}
[data-theme=dark] .btn.act-sum{background:#2b1907;color:#f3b068;border-color:#5c350a}
.btn.act-q{border-color:#7b4a8f;color:#7b4a8f;background:#f8f0fc}
[data-theme=dark] .btn.act-q{background:#26112e;color:#d59bed;border-color:#552469}
.btn.off{border:1px dashed var(--line);color:var(--mute);opacity:0.6;font-size:.75rem}
.btn.wait{border-color:var(--line);color:var(--mute);animation:pulse 1.2s infinite}

.note{margin-top:12px;padding:10px 12px;background:var(--soft);border-radius:8px;font-size:.8125rem}
.note b{color:var(--acc);font-weight:600}

.toast{position:fixed;inset-inline:16px;bottom:20px;margin:auto;max-width:360px;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:10px;font-size:.875rem;text-align:center;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}
.toast.on{opacity:1;transform:none}
@keyframes pulse{50%{opacity:.35}}
@media(min-width:640px){:root{--pad:24px}.lec{grid-template-columns:84px 1fr}}
@media(min-width:900px){.wrap{max-width:960px}.list{grid-template-columns:1fr 1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body class="loading">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
<symbol id="moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></symbol>
<symbol id="lock" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></symbol>
<symbol id="refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 00-14.9-3M4 4v4h4M4 13a8 8 0 0014.9 3M20 20v-4h-4"/></symbol>
<symbol id="mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></symbol>
<symbol id="file" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></symbol>
<symbol id="book" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></symbol>
<symbol id="quiz" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></symbol>
<symbol id="copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 012-2h9"/></symbol>
<symbol id="pin" viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11a7 7 0 10-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></symbol>
</defs></svg>

<header><div class="wrap">
  <div class="bar">
    <div><h1 id="tt"></h1><p class="sub" id="ts"></p></div>
    <div class="tools">
      <button class="ib" id="langBtn"></button>
      <button class="ib" id="themeBtn"></button>
      <button class="ib" id="adminBtn"><svg class="i"><use href="#lock"/></svg></button>
    </div>
  </div>
  <div class="admin" id="adminBar"><a id="sheetLink" target="_blank" rel="noopener"></a><button id="logoutBtn"></button></div>
</div></header>

<nav class="nav"><div class="wrap">
  <div class="wk-h"><span id="wkLabel"></span><b id="wkNow"></b></div>
  <div class="weeks" id="weeks"></div>
  <div class="days" id="days" role="tablist"></div>
</div></nav>

<main class="wrap">
  <div class="dh">
    <div><h2 id="dayTitle"></h2><span class="cnt" id="dayCount"></span></div>
    <div class="tools">
      <button class="ib txt" id="copyBtn" hidden><svg class="i"><use href="#copy"/></svg><span id="copyTxt"></span></button>
      <button class="ib" id="refreshBtn"><svg class="i"><use href="#refresh"/></svg></button>
    </div>
  </div>
  <p class="msg" id="msg" hidden></p>
  <div class="list" id="list"></div>
</main>
<div class="toast" id="toast" role="status"></div>

<script>
const SHEET_ID='155dq1qg3Mt_P0JaF7zfxptKXFsD-v89thOskJeEiy58';
const EDIT_URL=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/edit`;
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const T={
ar:{title:'دليل المحاضرات والمحتوى',sub:'الفرقة الرابعة • الفصل الدراسي الأول',weeks:'الأسابيع الدراسية',week:'الأسبوع',n:'محاضرات',audio:'الريكورد',pdf:'الداتا',sum:'الملخص',q:'الأسئلة',noAudio:'لا يوجد تسجيل',noPdf:'لا توجد داتا',noSum:'لا يوجد ملخص',noQ:'لا توجد أسئلة',note:'ملاحظة',edit:'تعديل الشيت',out:'خروج',copy:'نسخ لـ Telegram',copied:'تم نسخ رسالة التليجرام',pass:'أدخل رمز دخول المشرف:',err:'تعذر تحميل الروابط. تحقق من الاتصال ثم اضغط تحديث.',refresh:'تحديث',theme:'تغيير المظهر',admin:'دخول المشرف',lang:'EN',
 days:['السبت','الأحد','الإثنين','الثلاثاء','الأربعاء'],short:['السبت','الأحد','الإثنين','الثلاثاء','الأربعاء']},
en:{title:'Academic Course Companion',sub:'4th Year • 1st Semester',weeks:'Academic weeks',week:'Week',n:'sessions',audio:'Audio',pdf:'Slides',sum:'Summary',q:'Quiz',noAudio:'No audio',noPdf:'No slides',noSum:'No summary',noQ:'No quiz',note:'Note',edit:'Edit sheet',out:'Logout',copy:'Copy for Telegram',copied:'Telegram message copied',pass:'Enter admin passcode:',err:"Couldn't load links.",refresh:'Refresh',theme:'Toggle theme',admin:'Admin login',lang:'عربي',
 days:['Saturday','Sunday','Monday','Tuesday','Wednesday'],short:['Sat','Sun','Mon','Tue','Wed']}
};
const D=['sat','sun','mon','tue','wed'];
const TY={L:['نظري','Lecture'],C:['إكلينيكي / مستشفى','Clinical / Hospital'],B:['معملي','Lab']};

const S=[
// السبت
['sat','L','ع.ط جراحة وحروق','P.T. for Surgery & Burns','مدرج (ج)','Hall (C)','10:00 - 12:00'],
['sat','L','ع.ط للجلد والأغشية','P.T. for Integumentary','مدرج (ج)','Hall (C)','12:00 - 01:00'],
['sat','L','جراحة عامة وحروق','General Surgery & Burns','مدرج (ج)','Hall (C)','01:00 - 03:00'],
// الأحد
['sun','C','ع.ط لصحة المرأة',"P.T. for Women's Health",'C 10-11-12-13 + C 20','C 10-11-12-13 + C 20','09:00 - 11:00'],
['sun','B','ع.ط لصحة المرأة',"P.T. for Women's Health",'الدور الرابع D 1-8-9-15-17','4th Floor D 1-8-9-15-17','11:00 - 01:00'],
['sun','L','ع.ط لصحة المرأة',"P.T. for Women's Health",'مدرج (د)','Hall (D)','01:00 - 03:00'],
// الإثنين
['mon','C','ع.ط جراحة','P.T. for Surgery (Clinical)','الدور الثالث C-7-8-9-10-11','3rd Floor C-7-8-9-10-11','09:00 - 12:00'],
['mon','C','ع.ط حروق','P.T. for Burns (Clinical)','الدور الثالث C-7-8-9-10-11','3rd Floor C-7-8-9-10-11','09:00 - 12:00'],
['mon','L','أمراض نساء وتوليد','Obstetrics & Gynecology','مدرج (أ)','Hall (A)','12:00 - 02:00'],
['mon','L','ميكانيكا العمل','Ergonomics / Occupational','مدرج (أ)','Hall (A)','02:00 - 03:00'],
['mon','B','ميكانيكا العمل','Ergonomics / Occupational','مدرج (أ)','Hall (A)','03:00 - 05:00'],
// الثلاثاء
['tue','C','ع.ط لاضطرابات الحوض لدى السيدات','P.T. for Female Pelvic Disorders','الدور الثالث C10-11-12-13 + C20','3rd Floor C10-11-12-13 + C20','09:00 - 12:00'],
['tue','L','ع.ط لاضطرابات الحوض لدى السيدات','P.T. for Female Pelvic Disorders','مدرج (هـ)','Hall (E)','12:00 - 02:00'],
// الأربعاء
['wed','C','ع.ط للجلد والأغشية','P.T. for Integumentary','الدور الرابع D 1-8-9-15-17','4th Floor D 1-8-9-15-17','09:00 - 12:00'],
['wed','B','ع.ط جراحة','P.T. for Surgery (Lab)','الدور الرابع D 1-8-9-15-17','4th Floor D 1-8-9-15-17','12:00 - 02:00'],
['wed','B','ع.ط حروق','P.T. for Burns (Lab)','الدور الرابع D 1-8-9-15-17','4th Floor D 1-8-9-15-17','12:00 - 02:00'],
['wed','L','أمراض جلدية','Dermatology','مدرج (ب)','Hall (B)','02:00 - 04:00']
];

const TODAY=({6:'sat',0:'sun',1:'mon',2:'tue',3:'wed'})[new Date().getDay()]||'sat';
let lang=store.get('PT_LANG')==='en'?'en':'ar';
let week=Math.min(14,Math.max(1,+store.get('PT_WEEK')||1));
let day=TODAY, admin=store.get('PT_ADMIN')==='true';
let data={}, cache={}, state='load', reqId=0;

const lookup=(d,subj,ty)=>{
  const fullType = TY[ty][0];
  const shortType = ty === 'L' ? 'نظري' : (ty === 'B' ? 'معملي' : 'إكلينيكي');
  return data[`${d}_${subj}_${fullType}`] || data[`${d}_${subj}_${shortType}`] || data[`${d}_${subj}`] || {};
};

const isUrl=u=>/^https?:\/\//i.test(u||'');

function setLang(l){
  lang=l;store.set('PT_LANG',l);
  const d=document.documentElement,t=T[l];
  d.lang=l;d.dir=l==='ar'?'rtl':'ltr';
  $('tt').textContent=t.title;$('ts').textContent=t.sub;$('wkLabel').textContent=t.weeks;
  $('sheetLink').textContent=t.edit;$('sheetLink').href=EDIT_URL;$('logoutBtn').textContent=t.out;
  $('copyTxt').textContent=t.copy;$('msg').textContent=t.err;$('langBtn').textContent=t.lang;
  $('refreshBtn').title=$('refreshBtn').ariaLabel=t.refresh;
  $('themeBtn').ariaLabel=t.theme;$('adminBtn').ariaLabel=t.admin;
  renderWeeks();markWeek('auto');renderDays();renderList();
}
function applyTheme(t){
  document.documentElement.dataset.theme=t;
  $('themeBtn').innerHTML=`<svg class="i"><use href="#${t==='dark'?'sun':'moon'}"/></svg>`;
  document.querySelector('meta[name=theme-color]').content=t==='dark'?'#0e1113':'#f2f4f5';
}
function renderWeeks(){
  const c=$('weeks');c.innerHTML='';
  for(let i=1;i<=14;i++){
    const b=document.createElement('button');
    b.className='wk';b.textContent=i;b.ariaLabel=`${T[lang].week} ${i}`;
    b.onclick=()=>{week=i;store.set('PT_WEEK',i);markWeek('smooth');load();};
    c.appendChild(b);
  }
}
function markWeek(beh){
  [...$('weeks').children].forEach((b,i)=>{
    const on=i+1===week;b.setAttribute('aria-pressed',on);
    if(on)b.scrollIntoView({inline:'center',block:'nearest',behavior:beh});
  });
  $('wkNow').textContent=`${T[lang].week} ${week}`;
}
function renderDays(){
  const c=$('days');c.innerHTML='';
  D.forEach((k,i)=>{
    const b=document.createElement('button');
    b.className='day'+(k===TODAY?' today':'');
    b.setAttribute('role','tab');b.setAttribute('aria-selected',k===day);
    b.innerHTML=`<span>${T[lang].short[i]}</span>`;
    b.onclick=()=>{day=k;renderDays();renderList();};
    c.appendChild(b);
  });
}
function renderList(){
  const t=T[lang],items=S.filter(s=>s[0]===day);
  $('dayTitle').textContent=t.days[D.indexOf(day)];
  $('dayCount').textContent=`${items.length} ${t.n}`;

  const btn=(url,label,off,cls,icon)=>{
    const ic=`<svg class="i"><use href="#${icon}"/></svg>`;
    if(state==='load')return `<span class="btn wait">${ic}${label}</span>`;
    return isUrl(url)?`<a class="btn ${cls}" href="${esc(url)}" target="_blank" rel="noopener">${ic}${label}</a>`:`<span class="btn off">${off}</span>`;
  };

  $('list').innerHTML=items.map(s=>{
    const [,ty,sa,se,pa,pe,tm]=s,it=lookup(day,sa,ty),[a,b]=tm.split(' - ');
    const subj=lang==='ar'?sa:se,place=lang==='ar'?pa:(pe||pa);
    return `<article class="lec" data-t="${ty}">
      <div class="time"><b>${a}</b><span>${b}</span></div>
      <div class="body">
        <div class="tag"><i></i>${TY[ty][lang==='ar'?0:1]}</div>
        <h3>${subj}</h3>
        <p class="meta"><svg class="i"><use href="#pin"/></svg><bdi>${place}</bdi></p>
        <div class="acts">
          ${btn(it.audio,t.audio,t.noAudio,'act-audio','mic')}
          ${btn(it.pdf,t.pdf,t.noPdf,'act-pdf','file')}
          ${btn(it.summary,t.sum,t.noSum,'act-sum','book')}
          ${btn(it.questions,t.q,t.noQ,'act-q','quiz')}
        </div>
        ${it.note?`<p class="note"><b>${t.note}:</b> ${esc(it.note)}</p>`:''}
      </div></article>`;
  }).join('');
}
function parse(res){
  const out={};
  ((res&&res.table&&res.table.rows)||[]).forEach(r=>{
    const c=r.c||[],v=i=>c[i]&&c[i].v!=null?String(c[i].v).trim():'';
    // الأعمدة: 1:المادة | 2:النوع | 5:Audio | 6:PDF | 7:Summary | 8:Questions | 9:Note | 10:dayKey
    const subj=v(1),type=v(2);
    const d=(v(10)||v(8)||v(7)).toLowerCase();
    const o={audio:v(5),pdf:v(6),summary:v(7),questions:v(8),note:v(9)};
    if(o.note.toLowerCase()===d)o.note='';

    out[`${d}_${subj}`]=o;
    if(type){
      out[`${d}_${subj}_${type}`]=o;
      if(type.includes('إكلينيكي')) out[`${d}_${subj}_إكلينيكي`]=o;
      if(type.includes('معمل')) out[`${d}_${subj}_معملي`]=o;
      if(type.includes('نظري')) out[`${d}_${subj}_نظري`]=o;
    }
  });
  return out;
}
function load(force){
  const my=++reqId;
  if(force)delete cache[week];
  if(cache[week]){data=cache[week];state='ok';document.body.classList.remove('loading');$('msg').hidden=true;renderList();return;}
  state='load';data={};document.body.classList.add('loading');$('msg').hidden=true;renderList();
  const cb='gs_'+my,s=document.createElement('script');
  const finish=(ok,res)=>{
    delete window[cb];s.remove();
    if(my!==reqId)return;
    document.body.classList.remove('loading');
    if(ok){data=parse(res);cache[week]=data;state='ok';}else state='err';
    $('msg').hidden=ok;renderList();
  };
  window[cb]=res=>finish(true,res);
  s.onerror=()=>finish(false);
  s.src=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?sheet=${encodeURIComponent('الأسبوع '+week)}&tqx=responseHandler:${cb}&_t=${Date.now()}`;
  document.body.appendChild(s);
}
function toast(m){const e=$('toast');e.textContent=m;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2200);}
function renderAdmin(){
  $('adminBar').classList.toggle('on',admin);$('copyBtn').hidden=!admin;$('adminBtn').hidden=admin;
}

$('langBtn').onclick=()=>setLang(lang==='ar'?'en':'ar');
$('themeBtn').onclick=()=>{const t=document.documentElement.dataset.theme==='dark'?'light':'dark';store.set('PT_THEME',t);applyTheme(t);};
$('refreshBtn').onclick=()=>load(true);
$('adminBtn').onclick=()=>{if(prompt(T[lang].pass)==='admin2026'){admin=true;store.set('PT_ADMIN','true');renderAdmin();}};
$('logoutBtn').onclick=()=>{admin=false;store.del('PT_ADMIN');renderAdmin();};
$('copyBtn').onclick=()=>{
  const a=T.ar;
  let text=`📌 *محتوى يوم ${a.days[D.indexOf(day)]} (${a.week} ${week})*\n───────────────────\n\n`;
  S.filter(s=>s[0]===day).forEach(s=>{
    const [,ty,sa,,pa]=s,it=lookup(day,sa,ty);
    text+=`🔹 *${sa}* (${TY[ty][0]})\n`;
    if(pa) text+=`📍 المكان: ${pa}\n`;
    if(isUrl(it.audio)) text+=`🎙️ الريكورد: ${it.audio}\n`;
    if(isUrl(it.pdf)) text+=`📑 الداتا: ${it.pdf}\n`;
    if(isUrl(it.summary)) text+=`📖 الملخص: ${it.summary}\n`;
    if(isUrl(it.questions)) text+=`❓ الأسئلة: ${it.questions}\n`;
    if(it.note) text+=`💡 ملاحظة: ${it.note}\n`;
    text+='\n';
  });
  text+=`#الأسبوع_${week} #الفرقة_الرابعة`;
  const ok=()=>toast(T[lang].copied);
  (navigator.clipboard?navigator.clipboard.writeText(text):Promise.reject()).then(ok,()=>{
    const x=document.createElement('textarea');x.value=text;document.body.appendChild(x);x.select();
    try{document.execCommand('copy');ok();}catch(e){}x.remove();
  });
};

applyTheme(document.documentElement.dataset.theme||'light');
renderAdmin();
setLang(lang);
load();
</script>
