<!DOCTYPE html>

  <script>

  <link rel="preconnect" href="https://fonts.googleapis.com">

    body { font-family: 'Tajawal', 'Plus Jakarta Sans', sans-serif; }

  </style>
</head>
<body class="bg-slate-50 dark:bg-[#0b0f17] text-slate-800 dark:text-slate-100 min-h-screen antialiased transition-colors duration-200">

  <!-- Header -->
  <header class="border-b border-slate-200 dark:border-slate-800/80 bg-white/80 dark:bg-[#0f172a]/70 backdrop-blur-xl sticky top-0 z-40">
    <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center shadow-lg shadow-indigo-500/20 text-white">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
          </svg>
        </div>
        <div>
          <h1 id="t-header-title" class="text-sm sm:text-base font-bold text-slate-900 dark:text-white tracking-wide">المحتوى الأكاديمي الأسبوعي</h1>
          <p id="t-header-sub" class="text-[11px] text-slate-500 dark:text-slate-400">الفرقة الرابعة • الفصل الدراسي الأول</p>
        </div>
      </div>

      <!-- أدوات التحكم والآدمن -->
      <div class="flex items-center gap-1.5 sm:gap-2">
        <!-- زر اللغة -->
        <button id="langToggleBtn" class="px-2.5 py-1.5 rounded-xl border border-slate-200 dark:border-slate-800 text-xs font-bold text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition">
          EN
        </button>

        <!-- زر الوضع النهاري/الليلي -->
        <button id="themeToggleBtn" class="p-2 rounded-xl border border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition" title="Toggle Theme">
          <svg id="sunIcon" class="w-4 h-4 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 9h-1m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
          <svg id="moonIcon" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" /></svg>
        </button>

        <!-- لوحة المشرف -->
        <div id="adminPanel" class="hidden items-center gap-1 sm:gap-2">
          <a id="sheetLink" target="_blank" class="text-xs bg-emerald-600/10 dark:bg-emerald-600/20 text-emerald-600 dark:text-emerald-400 hover:bg-emerald-600 hover:text-white border border-emerald-500/30 px-2.5 py-1.5 rounded-xl transition font-medium flex items-center gap-1">
            <span id="t-edit-sheet">تعديل الشيت</span>
          </a>
          <button id="logoutBtn" class="text-xs text-slate-400 hover:text-slate-600 dark:hover:text-white px-1.5 py-1">خروج</button>
        </div>

        <button id="adminBtn" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 p-2 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 transition" title="Admin">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-6 space-y-6">

    <!-- شريط تصفح الأسابيع -->
    <div class="space-y-2">
      <div class="flex items-center justify-between text-xs px-1">
        <span id="t-academic-week" class="text-slate-500 dark:text-slate-400 font-medium">الأسبوع الدراسي</span>
        <span id="activeWeekDisplay" class="font-bold text-indigo-600 dark:text-indigo-400">الأسبوع 1</span>
      </div>
      <div id="weeksNav" class="flex gap-2 overflow-x-auto no-scrollbar py-1"></div>
    </div>

    <!-- شريط الأيام -->
    <div id="daysNav" class="grid grid-cols-5 gap-1.5 sm:gap-2.5 p-1 bg-slate-200/60 dark:bg-slate-900/60 rounded-2xl border border-slate-300 dark:border-slate-800/80"></div>

    <!-- شريط تفاصيل المحاضرات -->
    <div class="flex items-center justify-between pt-2">
      <div class="flex items-center gap-2">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
        <h2 id="dayTitle" class="text-sm sm:text-base font-bold text-slate-900 dark:text-white">محاضرات اليوم</h2>
      </div>
      <div class="flex items-center gap-2">
        <button id="copyTgBtn" class="hidden text-xs bg-white dark:bg-slate-800 hover:bg-slate-100 dark:hover:bg-slate-700 text-sky-600 dark:text-sky-400 border border-slate-200 dark:border-slate-700 px-3 py-1.5 rounded-xl transition font-medium items-center gap-1.5 shadow-sm">
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 00-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.74-.55 2.92-1.27 4.86-2.11 5.83-2.51 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .38z"/></svg>
          <span id="t-copy-tg">نسخ لـ Telegram</span>
        </button>
        <button id="refreshBtn" class="text-slate-400 hover:text-slate-600 dark:hover:text-white p-1.5 rounded-xl hover:bg-slate-200 dark:hover:bg-slate-800 transition" title="Refresh">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
        </button>
      </div>
    </div>

    <!-- مؤشر التحميل -->
    <div id="loader" class="py-16 text-center">
      <div class="inline-block w-6 h-6 border-2 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
    </div>

    <!-- قائمة المحاضرات -->
    <div id="lecturesList" class="space-y-2.5 hidden"></div>

  </main>

  <script>
    const SHEET_ID = '155dq1qg3Mt_P0JaF7zfxptKXFsD-v89thOskJeEiy58';
    const SHEET_EDIT_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/edit`;

    const translations = {
      ar: {
        headerTitle: "المحتوى الأكاديمي الأسبوعي",
        headerSub: "الفرقة الرابعة • الفصل الدراسي الأول (نساء وجراحة)",
        academicWeek: "الأسبوع الدراسي",
        weekPrefix: "الأسبوع",
        dayLectures: "محاضرات",
        editSheet: "تعديل الشيت",
        logout: "خروج",
        copyTg: "نسخ لـ Telegram",
        noAudio: "لا يوجد تسجيل",
        noPdf: "لا توجد داتا",
        audioBtn: "الريكورد",
        pdfBtn: "الداتا",
        noLectures: "لا توجد محاضرات مجدولة لهذا اليوم",
        adminPrompt: "أدخل رمز دخول المشرف:",
        copied: "تم نسخ رسالة التليجرام بنجاح!",
        days: { sat: "السبت", sun: "الأحد", mon: "الإثنين", tue: "الثلاثاء", wed: "الأربعاء" }
      },
      en: {
        headerTitle: "Weekly Academic Guide",
        headerSub: "4th Year • 1st Semester (Gynecology & Surgery)",
        academicWeek: "Academic Week",
        weekPrefix: "Week",
        dayLectures: "Lectures for",
        editSheet: "Edit Sheet",
        logout: "Logout",
        copyTg: "Copy for Telegram",
        noAudio: "No Recording",
        noPdf: "No Slides",
        audioBtn: "Audio",
        pdfBtn: "Slides",
        noLectures: "No lectures scheduled for this day",
        adminPrompt: "Enter admin passcode:",
        copied: "Telegram message copied successfully!",
        days: { sat: "Saturday", sun: "Sunday", mon: "Monday", tue: "Tuesday", wed: "Wednesday" }
      }
    };

    // القالب الرسمي الكامل لجدول الكلية
    const baseSchedule = [
      // السبت
      { dayKey: 'sat', subject_ar: 'ع.ط جراحة وحروق', subject_en: 'P.T. for Surgery & Burns', type_ar: 'نظري', type_en: 'Lecture', place_ar: 'مدرج (ج)', place_en: 'Hall (C)', time: '10:00 - 12:00' },
      { dayKey: 'sat', subject_ar: 'ع.ط للجلد والأغشية', subject_en: 'P.T. for Integumentary', type_ar: 'نظري', type_en: 'Lecture', place_ar: 'مدرج (ج)', place_en: 'Hall (C)', time: '12:00 - 01:00' },
      { dayKey: 'sat', subject_ar: 'جراحة عامة وحروق', subject_en: 'General Surgery & Burns', type_ar: 'نظري', type_en: 'Lecture', place_ar: 'مدرج (ج)', place_en: 'Hall (C)', time: '01:00 - 03:00' },
      // الأحد
      { dayKey: 'sun', subject_ar: 'ع.ط لصحة المرأة', subject_en: "P.T. for Women's Health", type_ar: 'إكلينيكي / مستشفى', type_en: 'Clinical / Hospital', place_ar: 'C 10-11-12-13 + C 20', place_en: 'C 10-11-12-13 + C 20', time: '09:00 - 11:00' },
      { dayKey: 'sun', subject_ar: 'ع.ط لصحة المرأة', subject_en: "P.T. for Women's Health", type_ar: 'معملي', type_en: 'Lab', place_ar: 'الدور الرابع D 1-8-9-15-17', place_en: '4th Floor D 1-8-9-15-17', time: '11:00 - 01:00' },
      { dayKey: 'sun', subject_ar: 'ع.ط لصحة المرأة', subject_en: "P.T. for Women's Health", type_ar: 'نظري', type_en: 'Lecture', place_ar: 'مدرج (د)', place_en: 'Hall (D)', time: '01:00 - 03:00' },
      // الإثنين
      { dayKey: 'mon', subject_ar: 'ع.ط جراحة وحروق', subject_en: 'P.T. for Surgery & Burns', type_ar: 'إكلينيكي / مستشفى', type_en: 'Clinical / Hospital', place_ar: 'الدور الثالث C-7-8-9-10-11', place_en: '3rd Floor C-7-8-9-10-11', time: '09:00 - 12:00' },
      { dayKey: 'mon', subject_ar: 'أمراض نساء وتوليد', subject_en: 'Obstetrics & Gynecology', type_ar: 'نظري', type_en: 'Lecture', place_ar: 'مدرج (أ)', place_en: 'Hall (A)', time: '12:00 - 02:00' },
      { dayKey: 'mon', subject_ar: 'ميكانيكا العمل', subject_en: 'Ergonomics / Occupational', type_ar: 'نظري', type_en: 'Lecture', place_ar: 'مدرج (أ)', place_en: 'Hall (A)', time: '02:00 - 03:00' },
      { dayKey: 'mon', subject_ar: 'ميكانيكا العمل', subject_en: 'Ergonomics / Occupational', type_ar: 'معملي', type_en: 'Lab', place_ar: 'مدرج (أ)', place_en: 'Hall (A)', time: '03:00 - 05:00' },
      // الثلاثاء
      { dayKey: 'tue', subject_ar: 'ع.ط لاضطرابات الحوض لدى السيدات', subject_en: 'P.T. for Female Pelvic Disorders', type_ar: 'إكلينيكي / مستشفى', type_en: 'Clinical / Hospital', place_ar: 'الدور الثالث C10-11-12-13 + C20', place_en: '3rd Floor C10-11-12-13 + C20', time: '09:00 - 12:00' },
      { dayKey: 'tue', subject_ar: 'ع.ط لاضطرابات الحوض لدى السيدات', subject_en: 'P.T. for Female Pelvic Disorders', type_ar: 'نظري', type_en: 'Lecture', place_ar: 'مدرج (هـ)', place_en: 'Hall (E)', time: '12:00 - 02:00' },
      // الأربعاء
      { dayKey: 'wed', subject_ar: 'ع.ط للجلد والأغشية', subject_en: 'P.T. for Integumentary', type_ar: 'إكلينيكي / مستشفى', type_en: 'Clinical / Hospital', place_ar: 'الدور الرابع D 1-8-9-15-17', place_en: '4th Floor D 1-8-9-15-17', time: '09:00 - 12:00' },
      { dayKey: 'wed', subject_ar: 'ع.ط جراحة وحروق', subject_en: 'P.T. for Surgery & Burns', type_ar: 'معملي', type_en: 'Lab', place_ar: 'الدور الرابع D 1-8-9-15-17', place_en: '4th Floor D 1-8-9-15-17', time: '12:00 - 02:00' },
      { dayKey: 'wed', subject_ar: 'أمراض جلدية', subject_en: 'Dermatology', type_ar: 'نظري', type_en: 'Lecture', place_ar: 'مدرج (ب)', place_en: 'Hall (B)', time: '02:00 - 04:00' }
    ];

    let currentLang = localStorage.getItem('PT_LANG') || 'ar';
    let currentWeek = 1;
    let currentDay = 'sat';
    let isAdmin = localStorage.getItem('PT_ADMIN') === 'true';
    let sheetLinks = {};

    function setLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('PT_LANG', lang);
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';

      const t = translations[lang];
      document.getElementById('t-header-title').innerText = t.headerTitle;
      document.getElementById('t-header-sub').innerText = t.headerSub;
      document.getElementById('t-academic-week').innerText = t.academicWeek;
      document.getElementById('t-edit-sheet').innerText = t.editSheet;
      document.getElementById('logoutBtn').innerText = t.logout;
      document.getElementById('t-copy-tg').innerText = t.copyTg;
      document.getElementById('langToggleBtn').innerText = lang === 'ar' ? 'EN' : 'عربي';

      renderWeeks();
      renderDays();
      renderLectures();
    }

    function initTheme() {
      const isDark = localStorage.getItem('PT_THEME') !== 'light';
      if (isDark) {
        document.documentElement.classList.add('dark');
        document.getElementById('sunIcon').classList.add('hidden');
        document.getElementById('moonIcon').classList.remove('hidden');
      } else {
        document.documentElement.classList.remove('dark');
        document.getElementById('moonIcon').classList.add('hidden');
        document.getElementById('sunIcon').classList.remove('hidden');
      }
    }

    document.getElementById('themeToggleBtn').onclick = () => {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('PT_THEME', isDark ? 'dark' : 'light');
      initTheme();
    };

    document.getElementById('langToggleBtn').onclick = () => {
      setLanguage(currentLang === 'ar' ? 'en' : 'ar');
    };

    function renderWeeks() {
      const container = document.getElementById('weeksNav');
      const t = translations[currentLang];
      container.innerHTML = '';

      for (let i = 1; i <= 14; i++) {
        const btn = document.createElement('button');
        const active = currentWeek === i;
        btn.className = `px-3.5 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition-all ${
          active 
            ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/25 ring-1 ring-indigo-400' 
            : 'bg-white dark:bg-slate-900/90 text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 border border-slate-200 dark:border-slate-800/80'
        }`;
        btn.innerText = `${t.weekPrefix} ${i}`;
        btn.onclick = () => {
          currentWeek = i;
          document.getElementById('activeWeekDisplay').innerText = `${t.weekPrefix} ${i}`;
          renderWeeks();
          fetchData(); // جلب تبويب الأسبوع المختار
        };
        container.appendChild(btn);
      }
    }

    function renderDays() {
      const container = document.getElementById('daysNav');
      const t = translations[currentLang];
      const dayKeys = ['sat', 'sun', 'mon', 'tue', 'wed'];
      container.innerHTML = '';

      dayKeys.forEach(key => {
        const active = currentDay === key;
        const btn = document.createElement('button');
        btn.className = `py-2 rounded-xl text-xs sm:text-sm font-semibold transition-all ${
          active 
            ? 'bg-white dark:bg-slate-800 text-indigo-600 dark:text-indigo-400 shadow-sm border border-slate-200 dark:border-slate-700' 
            : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200 hover:bg-white/50 dark:hover:bg-slate-800/50'
        }`;
        btn.innerText = t.days[key];
        btn.onclick = () => {
          currentDay = key;
          renderDays();
          renderLectures();
        };
        container.appendChild(btn);
      });
    }

    // جلب التبويب الخاص بالأسبوع الحالي من شيت جوجل
    function fetchData() {
      document.getElementById('loader').classList.remove('hidden');
      document.getElementById('lecturesList').classList.add('hidden');

      const sheetTabName = encodeURIComponent(`الأسبوع ${currentWeek}`);

      window.googleSheetCallback = function(res) {
        try {
          const rows = res.table ? res.table.rows || [] : [];
          sheetLinks = {};

          rows.forEach(r => {
            const c = r.c || [];
            // في التبويبات الجديدة:
            // 1: المادة | 5: الريكورد | 6: الداتا | 7: dayKey
            const subj = (c[1]?.v || '').toString().trim();
            const dKey = (c[7]?.v || '').toString().toLowerCase().trim();
            const audio = (c[5]?.v || '').toString().trim();
            const pdf = (c[6]?.v || '').toString().trim();

            const lookupKey = `${dKey}_${subj}`;
            sheetLinks[lookupKey] = { audio, pdf };
          });
        } catch (e) {
          console.error(e);
        } finally {
          document.getElementById('loader').classList.add('hidden');
          document.getElementById('lecturesList').classList.remove('hidden');
          renderLectures();
        }
      };

      const old = document.getElementById('jsonpScript');
      if (old) old.remove();

      const script = document.createElement('script');
      script.id = 'jsonpScript';
      script.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?sheet=${sheetTabName}&tqx=responseHandler:googleSheetCallback&_t=${Date.now()}`;
      
      script.onerror = function() {
        document.getElementById('loader').classList.add('hidden');
        document.getElementById('lecturesList').classList.remove('hidden');
        renderLectures();
      };

      document.body.appendChild(script);
    }

    function renderLectures() {
      const t = translations[currentLang];
      document.getElementById('dayTitle').innerText = `${t.dayLectures} ${t.days[currentDay]} • ${t.weekPrefix} ${currentWeek}`;

      const list = document.getElementById('lecturesList');
      list.innerHTML = '';

      const dayLectures = baseSchedule.filter(l => l.dayKey === currentDay);

      if (dayLectures.length === 0) {
        list.innerHTML = `
          <div class="py-12 text-center rounded-2xl border border-dashed border-slate-300 dark:border-slate-800">
            <p class="text-xs text-slate-500">${t.noLectures}</p>
          </div>
        `;
        return;
      }

      dayLectures.forEach(lec => {
        const lookupKey = `${currentDay}_${lec.subject_ar}`;
        const links = sheetLinks[lookupKey] || {};

        const audioUrl = links.audio && links.audio.startsWith('http') ? links.audio : null;
        const pdfUrl = links.pdf && links.pdf.startsWith('http') ? links.pdf : null;

        const card = document.createElement('div');
        card.className = "group bg-white dark:bg-[#0f172a]/60 hover:bg-slate-50 dark:hover:bg-[#0f172a] border border-slate-200 dark:border-slate-800/80 hover:border-slate-300 dark:hover:border-slate-700/80 rounded-2xl p-3.5 sm:p-4 transition flex flex-col sm:flex-row sm:items-center justify-between gap-3 shadow-sm dark:shadow-none";

        const subjectName = currentLang === 'ar' ? lec.subject_ar : lec.subject_en;
        const typeName = currentLang === 'ar' ? lec.type_ar : lec.type_en;
        const placeName = currentLang === 'ar' ? lec.place_ar : lec.place_en;

        let badgeColor = 'bg-blue-500/10 text-blue-600 dark:text-blue-400 border-blue-500/20';
        if (lec.type_ar.includes('إكلينيكي')) badgeColor = 'bg-amber-500/10 text-amber-600 dark:text-amber-400 border-amber-500/20';
        if (lec.type_ar.includes('معمل')) badgeColor = 'bg-purple-500/10 text-purple-600 dark:text-purple-400 border-purple-500/20';

        card.innerHTML = `
          <div class="flex items-start gap-3">
            <div class="mt-0.5">
              <div class="flex items-center gap-2">
                <span class="text-[10px] font-bold px-2 py-0.5 rounded-md border ${badgeColor}">
                  ${typeName}
                </span>
                <h3 class="text-sm sm:text-base font-bold text-slate-800 dark:text-slate-100">${subjectName}</h3>
              </div>
              <div class="flex items-center gap-3 text-[11px] text-slate-500 dark:text-slate-400 mt-1.5 font-medium">
                ${placeName ? `<span class="flex items-center gap-1">📍 ${placeName}</span>` : ''}
                ${lec.time ? `<span class="flex items-center gap-1 font-mono">⏰ ${lec.time}</span>` : ''}
              </div>
            </div>
          </div>

          <div class="flex items-center gap-2 self-end sm:self-center">
            ${audioUrl ? `
              <a href="${audioUrl}" target="_blank" class="text-xs bg-indigo-600/10 dark:bg-indigo-600/20 hover:bg-indigo-600 text-indigo-600 dark:text-indigo-300 hover:text-white border border-indigo-500/30 px-3 py-1.5 rounded-xl transition flex items-center gap-1.5 font-semibold">
                <span>${t.audioBtn}</span>
                <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 100-6 3 3 0 000 6z"/></svg>
              </a>
            ` : `<span class="text-[11px] text-slate-400 dark:text-slate-600 px-2 py-1">${t.noAudio}</span>`}

            ${pdfUrl ? `
              <a href="${pdfUrl}" target="_blank" class="text-xs bg-emerald-600/10 dark:bg-emerald-600/20 hover:bg-emerald-600 text-emerald-600 dark:text-emerald-300 hover:text-white border border-emerald-500/30 px-3 py-1.5 rounded-xl transition flex items-center gap-1.5 font-semibold">
                <span>${t.pdfBtn}</span>
                <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
              </a>
            ` : `<span class="text-[11px] text-slate-400 dark:text-slate-600 px-2 py-1">${t.noPdf}</span>`}
          </div>
        `;
        list.appendChild(card);
      });
    }

    function updateAdminState() {
      const panel = document.getElementById('adminPanel');
      const copyBtn = document.getElementById('copyTgBtn');
      const loginBtn = document.getElementById('adminBtn');
      document.getElementById('sheetLink').href = SHEET_EDIT_URL;

      if (isAdmin) {
        panel.classList.remove('hidden');
        panel.classList.add('flex');
        copyBtn.classList.remove('hidden');
        copyBtn.classList.add('flex');
        loginBtn.classList.add('hidden');
      } else {
        panel.classList.add('hidden');
        panel.classList.remove('flex');
        copyBtn.classList.add('hidden');
        copyBtn.classList.remove('flex');
        loginBtn.classList.remove('hidden');
      }
    }

    document.getElementById('adminBtn').onclick = () => {
      const t = translations[currentLang];
      const p = prompt(t.adminPrompt);
      if (p === 'admin2026') {
        isAdmin = true;
        localStorage.setItem('PT_ADMIN', 'true');
        updateAdminState();
      }
    };

    document.getElementById('logoutBtn').onclick = () => {
      isAdmin = false;
      localStorage.removeItem('PT_ADMIN');
      updateAdminState();
    };

    document.getElementById('copyTgBtn').onclick = () => {
      const t = translations[currentLang];
      const dayLectures = baseSchedule.filter(l => l.dayKey === currentDay);

      let text = `📌 *محتوى يوم ${translations.ar.days[currentDay]} (${translations.ar.weekPrefix} ${currentWeek})*\n`;
      text += `───────────────────\n\n`;

      dayLectures.forEach(lec => {
        const lookupKey = `${currentDay}_${lec.subject_ar}`;
        const links = sheetLinks[lookupKey] || {};
        text += `🔹 *${lec.subject_ar}* (${lec.type_ar})\n`;
        if (lec.place_ar) text += `📍 المكان: ${lec.place_ar}\n`;
        if (links.audio && links.audio.startsWith('http')) text += `🎙️ الريكورد: ${links.audio}\n`;
        if (links.pdf && links.pdf.startsWith('http')) text += `📑 الداتا: ${links.pdf}\n`;
        text += `\n`;
      });

      text += `#الأسبوع_${currentWeek} #الفرقة_الرابعة`;
      navigator.clipboard.writeText(text).then(() => alert(t.copied));
    };

    document.getElementById('refreshBtn').onclick = fetchData;

    initTheme();
    setLanguage(currentLang);
    updateAdminState();
    fetchData();
  </script>
</body>
</html>
