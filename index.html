/* ==========================================================================
   CSS Custom Properties & Design Tokens (WCAG 2.1 AA Compliant)
   ========================================================================== */
:root {
  --bg: #f4f6f5;
  --surface: #ffffff;
  --surface-raised: #ffffff;
  --ink: #0f1e1d;
  --mute: #4e605e;
  --mute-soft: #6f8381;
  --line: #d8e2df;
  --line2: #becdc9;
  
  --brand: #0c5551;
  --brand-hover: #083e3b;
  --on-brand: #ffffff;
  --soft: #e3eeec;
  --soft-ink: #0a4945;
  
  /* Type accent colors with verified contrast >= 4.5:1 on light surface */
  --t-theory: #25588f;
  --t-practical: #9c2b48;
  --t-hospital: #7a5003;

  /* Card elevation & shadows */
  --shadow-sm: 0 1px 3px rgba(12, 85, 81, 0.05);
  --shadow-md: 0 4px 14px rgba(12, 85, 81, 0.08);
  --shadow-hover: 0 8px 24px -8px rgba(0, 0, 0, 0.12);
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;

  color-scheme: light;
}

[data-theme="dark"] {
  --bg: #0b1312;
  --surface: #121c1b;
  --surface-raised: #182524;
  --ink: #e7f1ee;
  --mute: #92a7a4;
  --mute-soft: #6e8481;
  --line: #1c2b29;
  --line2: #2a3e3b;
  
  --brand: #5cbdb3;
  --brand-hover: #75cac1;
  --on-brand: #051d1a;
  --soft: rgba(92, 189, 179, 0.14);
  --soft-ink: #8be0d6;
  
  /* Type accent colors in dark mode (bright & readable) */
  --t-theory: #8cb7ed;
  --t-practical: #f095ab;
  --t-hospital: #e6be60;

  --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.35);
  --shadow-md: 0 4px 14px rgba(0, 0, 0, 0.45);
  --shadow-hover: 0 8px 24px -8px rgba(0, 0, 0, 0.45);

  color-scheme: dark;
}



/* ==========================================================================
   Animated Background (Pure CSS Mesh Gradient + Dot Grid)
   ========================================================================== */
.bg-mesh {
  position: fixed;
  inset: -20%;
  z-index: 0;
  pointer-events: none;
  background: 
    radial-gradient(circle at 20% 30%, color-mix(in srgb, var(--brand) 18%, transparent), transparent 45%),
    radial-gradient(circle at 80% 70%, color-mix(in srgb, var(--soft-ink) 14%, transparent), transparent 50%),
    radial-gradient(circle at 50% 50%, color-mix(in srgb, var(--brand) 8%, transparent), transparent 60%);
  filter: blur(60px);
  animation: meshMove 25s ease-in-out infinite alternate;
  will-change: transform;
}
@keyframes meshMove {
  0%   { transform: translate3d(0, 0, 0) scale(1); }
  50%  { transform: translate3d(-3%, 2%, 0) scale(1.08); }
  100% { transform: translate3d(2%, -2%, 0) scale(1.02); }
}

.bg-grid {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-image: radial-gradient(circle, color-mix(in srgb, var(--ink) 8%, transparent) 1px, transparent 1px);
  background-size: 24px 24px;
  mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
  -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
  animation: gridDrift 40s linear infinite;
}
@keyframes gridDrift {
  from { background-position: 0 0; }
  to   { background-position: 24px 24px; }
}

[data-theme="dark"] .bg-mesh { opacity: 0.7; filter: blur(80px); }
[data-theme="dark"] .bg-grid { opacity: 0.4; }

@media (max-width: 1024px) {
  .bg-mesh {
    filter: blur(25px);
    opacity: 0.25;
    animation: none;
    will-change: auto;
  }
  .bg-grid {
    animation: none;
  }
}

@media (max-width: 768px) {
  .bg-mesh,
  .bg-grid {
    display: none !important;
  }
}


/* Favorite Star Button & Animations */
.fav-btn {
  width: 32px;
  height: 32px;
  border-radius: var(--radius-sm);
  display: grid;
  place-items: center;
  color: var(--mute);
  background: none;
  border: 1px solid transparent;
  transition: color 0.15s, transform 0.15s;
  flex: none;
}
.fav-btn:hover {
  color: #f5b400;
  background: var(--soft);
}
.fav-btn[aria-pressed="true"] {
  color: #f5b400;
}
.fav-btn.anim-add {
  animation: favAdd 350ms cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.fav-btn.anim-rem {
  animation: favRem 250ms ease-out;
}
@keyframes favAdd {
  0% { transform: scale(1); }
  50% { transform: scale(1.35); color: #e6a100; }
  100% { transform: scale(1); }
}
@keyframes favRem {
  0% { transform: scale(1); }
  50% { transform: scale(0.8); opacity: 0.6; }
  100% { transform: scale(1); opacity: 1; }
}
.fav-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 18px;
  height: 18px;
  padding-inline: 5px;
  border-radius: 999px;
  background: var(--brand);
  color: var(--on-brand);
  font-size: 11px;
  font-weight: 700;
  margin-inline-start: 4px;
  vertical-align: middle;
}
.seg button[aria-selected="true"] .fav-badge {
  background: var(--brand);
  color: var(--on-brand);
}
.favs-top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 4px 16px;
}
.favs-top-bar span {
  font-size: 13.5px;
  font-weight: 600;
  color: var(--mute);
}
.clear-favs-btn {
  font-size: 12.5px;
  font-weight: 600;
  color: var(--mute);
  padding: 4px 10px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--line2);
  background: var(--surface);
  transition: all 0.15s;
}
.clear-favs-btn:hover {
  color: #dc2626;
  border-color: #dc2626;
  background: rgba(220, 38, 38, 0.05);
}


/* Subject View Top Action Bar */
.subj-actions-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 4px 12px;
}
.subj-actions-bar span {
  font-size: 13.5px;
  font-weight: 600;
  color: var(--mute);
}
.subj-toggle-btns {
  display: flex;
  gap: 8px;
  align-items: center;
}
.subj-action-btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  height: 32px;
  padding-inline: 11px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--line2);
  background: var(--surface);
  font-size: 13px;
  font-weight: 600;
  color: var(--ink);
  cursor: pointer;
  transition: all 0.15s ease;
}
.subj-action-btn .i {
  width: 15px;
  height: 15px;
  color: var(--brand);
  stroke: currentColor;
  stroke-width: 2.2;
}
.subj-action-btn:hover {
  color: var(--brand);
  border-color: var(--brand);
  background: var(--soft);
}


/* ==========================================================================
   Adhkar Marquee Ticker
   ========================================================================== */
.adhkar-bar {
  position: relative;
  width: calc(100% + 32px);
  margin-inline: -16px;
  height: 38px;
  overflow: hidden;
  background: color-mix(in srgb, var(--soft-ink) 8%, transparent);
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  margin-block: 16px 8px;
  display: flex;
  align-items: center;
  mask-image: linear-gradient(to left, transparent 0%, black 8%, black 92%, transparent 100%);
  -webkit-mask-image: linear-gradient(to left, transparent 0%, black 8%, black 92%, transparent 100%);
}

.adhkar-track {
  display: flex;
  align-items: center;
  gap: 0;
  white-space: nowrap;
  will-change: transform;
  animation: adhkarScroll 60s linear infinite;
}

.adhkar-track:hover {
  animation-play-state: paused;
}

.adhkar-item {
  display: inline-flex;
  align-items: center;
  padding-inline: 14px;
  font-size: 13.5px;
  font-weight: 500;
  color: var(--ink);
  white-space: nowrap;
  user-select: none;
}

.adhkar-sep {
  color: var(--soft-ink);
  opacity: 0.65;
  font-size: 13px;
  padding-inline: 4px;
  user-select: none;
}

@keyframes adhkarScroll {
  from { transform: translateX(0); }
  to   { transform: translateX(50%); }
}

@media (max-width: 640px) {
  .adhkar-bar { height: 35px; }
  .adhkar-item { font-size: 13px; padding-inline: 10px; }
}

@media (prefers-reduced-motion: reduce) {
  .adhkar-track {
    animation: none;
  }
}

/* ==========================================================================
   Base, Scrollbar & Focus Reset
   ========================================================================== */
*, *::before, *::after { box-sizing: border-box; margin: 0; }
html {
  scroll-behavior: smooth;
  -webkit-text-size-adjust: 100%;
}
body {
  font-family: 'IBM Plex Sans Arabic', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--ink);
  font-size: 15px;
  line-height: 1.65;
  min-height: 100vh;
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
  position: relative;
}

/* Custom Scrollbar */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 999px; }
::-webkit-scrollbar-thumb:hover { background: var(--brand); }
* { scrollbar-width: thin; scrollbar-color: var(--line2) transparent; }

/* Selection Color */
::selection { background: var(--soft); color: var(--soft-ink); }

[hidden] { display: none !important; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; }
a { color: inherit; text-decoration: none; }

/* Soft Focus Ring */
:focus-visible {
  outline: none;
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 30%, transparent);
  border-radius: inherit;
}

/* Skip Link for Keyboard Accessibility */
.skip-link {
  position: absolute;
  top: -100px;
  inset-inline-start: 16px;
  z-index: 1000;
  background: var(--brand);
  color: var(--on-brand);
  padding: 10px 18px;
  border-radius: var(--radius-sm);
  font-weight: 600;
  text-decoration: none;
  box-shadow: var(--shadow-md);
  transition: top 0.2s ease;
}
.skip-link:focus { top: 16px; }

.wrap {
  max-width: 760px;
  margin-inline: auto;
  padding-inline: 16px;
  position: relative;
  z-index: 1;
}
.i {
  width: 1.15em;
  height: 1.15em;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.85;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex: none;
}
.sr {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  border: 0;
}

/* ==========================================================================
   Header & Masthead
   ========================================================================== */
.mast { padding-top: 28px; }
.mast-row {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
}
h1 {
  font-size: 26px;
  font-weight: 700;
  line-height: 1.35;
  letter-spacing: -0.3px;
}
.sub {
  color: var(--mute);
  font-size: 13.5px;
  margin-top: 2px;
}
.acts { display: flex; gap: 8px; flex: none; align-items: center; }

/* Buttons */
.btn {
  height: 40px;
  padding-inline: 14px;
  border-radius: var(--radius-md);
  font-weight: 600;
  font-size: 13.5px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: var(--brand);
  color: var(--on-brand);
  transition: background-color 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease;
  user-select: none;
}
.btn:hover { background: var(--brand-hover); }
.btn:active { transform: scale(0.98); }
.btn.ghost {
  background: var(--surface);
  color: var(--ink);
  border: 1px solid var(--line2);
}
.btn.ghost:hover {
  background: var(--soft);
  border-color: var(--brand);
}
.btn-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 20px;
  height: 20px;
  padding-inline: 6px;
  border-radius: 999px;
  background: var(--on-brand);
  color: var(--brand);
  font-size: 11.5px;
  font-weight: 700;
  margin-inline-start: -2px;
}
.btn-badge.muted {
  background: rgba(255, 255, 255, 0.25);
  color: var(--on-brand);
}

.icon-btn {
  width: 40px;
  height: 40px;
  border-radius: var(--radius-md);
  border: 1px solid var(--line2);
  background: var(--surface);
  display: grid;
  place-items: center;
  color: var(--mute);
  flex: none;
  transition: color 0.15s, border-color 0.15s, background-color 0.15s, transform 0.1s;
}
.icon-btn:hover { color: var(--ink); border-color: var(--brand); background: var(--soft); }
.icon-btn.sm { width: 34px; height: 34px; border-radius: var(--radius-sm); }

/* Interactive Stats Row (Clickable Filter Shortcuts with Hover Scale) */
.stats {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 14px;
  margin-top: 14px;
  font-size: 13px;
  color: var(--mute);
}
.stat-item {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 8px;
  margin: -4px -8px;
  border-radius: var(--radius-sm);
  transition: transform 0.15s ease, background-color 0.15s ease, color 0.15s ease;
  cursor: pointer;
}
.stat-item:hover {
  background: var(--soft);
  color: var(--brand);
  transform: scale(1.05);
}
.stat-item b {
  color: var(--ink);
  font-weight: 700;
}
.stat-item.active {
  background: var(--soft);
  color: var(--brand);
  font-weight: 700;
}

.stat-today-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 8px;
  border-radius: var(--radius-sm);
  background: var(--soft);
  color: var(--soft-ink);
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
}
.stat-today-pill .i {
  color: var(--brand);
}

.stat-term-item {
  color: var(--brand);
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.stat-term-item b {
  color: var(--brand);
}

.stat-reset-btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 8px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--line2);
  background: var(--surface);
  color: var(--mute);
  font-size: 11.5px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s ease;
}
.stat-reset-btn:hover {
  color: var(--ink);
  border-color: var(--brand);
  background: var(--soft);
  transform: scale(1.03);
}

/* Term Progress Bar */
.term-progress {
  width: 100%;
  height: 4px;
  background: color-mix(in srgb, var(--brand) 12%, transparent);
  border-radius: 999px;
  overflow: hidden;
  margin-block: 8px 12px;
}
.term-progress-fill {
  height: 100%;
  background: var(--brand);
  border-radius: 999px;
  transition: width 0.4s ease;
}

/* Segmented Control (Accessible Tablist) */
.seg {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  background: var(--line);
  padding: 3px;
  border-radius: var(--radius-md);
  margin-top: 18px;
  position: relative;
}
.seg button {
  height: 38px;
  border-radius: calc(var(--radius-md) - 3px);
  font-weight: 600;
  font-size: 14px;
  color: var(--mute);
  transition: color 0.15s ease, background-color 0.15s ease, box-shadow 0.15s ease, transform 0.1s ease;
}
.seg button[aria-selected="true"] {
  background: var(--surface);
  color: var(--ink);
  box-shadow: var(--shadow-sm);
}

/* Search & Filter Bar */
.srow {
  display: flex;
  gap: 8px;
  margin-top: 12px;
  align-items: center;
}
.search {
  position: relative;
  flex: 1;
}
.search .i {
  position: absolute;
  inset-inline-start: 13px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--mute);
  pointer-events: none;
}
.search input {
  width: 100%;
  height: 44px;
  border-radius: var(--radius-md);
  border: 1px solid var(--line2);
  background: var(--surface);
  padding-inline: 40px 36px;
  font-size: 14px;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}
.search input::-webkit-search-decoration,
.search input::-webkit-search-cancel-button,
.search input::-webkit-search-results-button,
.search input::-webkit-search-results-decoration {
  -webkit-appearance: none;
  appearance: none;
  display: none;
}
.search input::-ms-clear,
.search input::-ms-reveal {
  display: none;
  width: 0;
  height: 0;
}
.search input:focus {
  border-color: var(--brand);
  box-shadow: 0 0 0 3px var(--soft);
  outline: none;
}
.search-clear {
  position: absolute;
  inset-inline-end: 10px;
  top: 50%;
  transform: translateY(-50%);
  width: 24px;
  height: 24px;
  border-radius: 50%;
  color: var(--mute);
  display: grid;
  place-items: center;
  transition: color 0.15s;
}
.search-clear:hover { color: var(--ink); }

.srow .btn.ghost {
  height: 44px;
  border-radius: var(--radius-md);
  flex-shrink: 0;
}
.cnt {
  min-width: 20px;
  height: 20px;
  border-radius: 999px;
  background: var(--brand);
  color: var(--on-brand);
  font-size: 11.5px;
  font-weight: 700;
  display: grid;
  place-items: center;
  padding-inline: 6px;
}

/* Animated Filters Panel (Accordion transition via CSS Grid) */
.filters-wrap {
  display: grid;
  grid-template-rows: 0fr;
  transition: grid-template-rows 200ms ease, opacity 200ms ease;
  opacity: 0;
  margin-top: 0;
}
.filters-wrap.is-open {
  grid-template-rows: 1fr;
  opacity: 1;
  margin-top: 10px;
}
.filters-inner {
  overflow: hidden;
  min-height: 0;
}
.filters {
  padding: 14px 16px;
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  background: var(--surface);
  box-shadow: var(--shadow-sm);
  display: grid;
  gap: 12px;
}
.frow {
  display: flex;
  gap: 10px;
  align-items: flex-start;
}
.flabel {
  width: 58px;
  flex: none;
  font-size: 13px;
  font-weight: 600;
  color: var(--mute);
  padding-top: 7px;
}
.pills {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.pill {
  position: relative;
  overflow: hidden;
  height: 36px;
  padding-inline: 13px;
  border-radius: 999px;
  border: 1px solid var(--line2);
  background: var(--surface);
  font-size: 13px;
  font-weight: 600;
  color: var(--mute);
  display: inline-flex;
  align-items: center;
  gap: 7px;
  transition: border-color 0.15s ease, color 0.15s ease, background-color 0.15s ease;
  user-select: none;
}
.pill:hover { border-color: var(--brand); color: var(--ink); }
.pill[aria-pressed="true"] {
  background: var(--brand);
  border-color: var(--brand);
  color: var(--on-brand);
}

/* Pill Click Ripple Effect (CSS Variable-driven) */
.pill::after {
  content: "";
  position: absolute;
  border-radius: 50%;
  background: currentColor;
  opacity: 0.25;
  transform: scale(0);
  pointer-events: none;
  transition: transform 0.35s ease-out, opacity 0.35s ease-out;
}
.pill.rippling::after {
  left: var(--rx, 50%);
  top: var(--ry, 50%);
  width: 100px;
  height: 100px;
  margin-left: -50px;
  margin-top: -50px;
  transform: scale(2.4);
  opacity: 0;
}

.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: currentColor;
  display: inline-block;
  flex: none;
}
.pill .dot { background: var(--tc); }
.pill[aria-pressed="true"] .dot { background: currentColor; }

.filters-footer {
  display: flex;
  justify-content: flex-end;
  padding-top: 4px;
  border-top: 1px dashed var(--line);
}
.filters-reset-btn {
  font-size: 12.5px;
  font-weight: 600;
  color: var(--mute);
  padding: 4px 8px;
  border-radius: var(--radius-sm);
  transition: color 0.15s;
}
.filters-reset-btn:hover { color: var(--brand); text-decoration: underline; }

/* ==========================================================================
   Week & Day Navigation (Collapsible on Mobile + Sticky Header)
   ========================================================================== */
.weeknav {
  position: sticky;
  top: 0;
  z-index: 20;
  margin-top: 18px;
  background: var(--bg);
  background: color-mix(in srgb, var(--bg) 90%, transparent);
  -webkit-backdrop-filter: blur(14px);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
  transition: padding 0.2s ease;
}

@media (max-width: 768px) {
  .weeknav {
    backdrop-filter: none !important;
    -webkit-backdrop-filter: none !important;
    background: var(--bg) !important;
  }
}
.weeknav-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-top: 8px;
}
.weekrow {
  display: flex;
  align-items: center;
  gap: 10px;
  flex: 1;
  min-width: 0;
}
.weekrow > span {
  font-size: 13px;
  font-weight: 600;
  color: var(--mute);
  flex: none;
}
.week-toggle-btn {
  display: none;
  align-items: center;
  gap: 4px;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--mute);
  padding: 4px 8px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--line2);
  background: var(--surface);
  margin-inline-start: 8px;
}
.week-toggle-btn .chev { transition: transform 0.2s; }
.week-toggle-btn[aria-expanded="false"] .chev { transform: rotate(-90deg); }

.weeks-collapsible {
  display: flex;
  flex: 1;
  min-width: 0;
  transition: max-height 0.2s ease, opacity 0.2s ease;
}
.weeks {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  flex: 1;
  scrollbar-width: none;
  padding-block: 2px;
}
.weeks::-webkit-scrollbar { display: none; }
.wk {
  flex: none;
  min-width: 46px;
  height: 44px;
  padding: 3px 6px;
  border-radius: var(--radius-md);
  border: 1px solid var(--line2);
  background: var(--surface);
  color: var(--mute);
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  line-height: 1.15;
  cursor: pointer;
  transition: transform 0.15s ease, background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
}
.wk:hover { color: var(--ink); border-color: var(--brand); }
.wk-num {
  font-size: 13.5px;
  font-weight: 700;
}
.wk-date {
  font-size: 10px;
  font-weight: 500;
  opacity: 0.85;
  white-space: nowrap;
}
.wk[aria-current="page"], .wk[aria-pressed="true"] {
  background: var(--brand);
  border-color: var(--brand);
  color: var(--on-brand);
  box-shadow: var(--shadow-sm);
}
.wk[aria-pressed="true"] .wk-date {
  opacity: 0.95;
}
.wk.current:not([aria-pressed="true"]) {
  border-color: var(--brand);
  background: color-mix(in srgb, var(--brand) 10%, var(--surface));
  color: var(--brand);
}
.wk.past:not([aria-pressed="true"]) {
  opacity: 0.65;
}


.days {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  margin-top: 6px;
  border-top: 1px solid var(--line);
}
.day {
  position: relative;
  height: 42px;
  font-size: 13.5px;
  font-weight: 600;
  color: var(--mute);
  white-space: nowrap;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  transition: color 0.15s ease, transform 0.15s ease;
}
.day:hover { color: var(--ink); }
.day[aria-selected="true"], .day[aria-pressed="true"] {
  color: var(--ink);
  font-weight: 700;
}
.day[aria-selected="true"]::after, .day[aria-pressed="true"]::after {
  content: "";
  position: absolute;
  inset-inline: 8px;
  bottom: 0;
  height: 2.5px;
  border-radius: 2px;
  background: var(--brand);
}
.today-dot {
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--brand);
}

/* Micro-interaction: Subtle Scale on Click for Week & Day buttons */
.btn-scale-click {
  animation: scaleClick 150ms ease-out;
}
@keyframes scaleClick {
  0%   { transform: scale(1); }
  50%  { transform: scale(0.95); }
  100% { transform: scale(1); }
}

/* ==========================================================================
   VIEW TRANSITIONS & CONTENT STAGGER (GPU Accelerated)
   ========================================================================== */
#content {
  transition: opacity 90ms ease-out;
}

#content.view-fade-out {
  opacity: 0;
  pointer-events: none;
}

.view-card-anim {
  animation: cardSlideUpIn 300ms cubic-bezier(0.16, 1, 0.3, 1) both !important;
  will-change: opacity, transform;
}

@keyframes cardSlideUpIn {
  0% {
    opacity: 0;
    transform: translateY(18px);
  }
  100% {
    opacity: 1;
    transform: translateY(0);
  }
}

/* ==========================================================================
   Featured Next Class Card ("المحاضرة القادمة")
   ========================================================================== */
.next-class-card {
  margin-bottom: 20px;
  padding: 16px 20px;
  background: var(--soft);
  border: 1px solid color-mix(in srgb, var(--brand) 35%, transparent);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  display: grid;
  gap: 10px;
  position: relative;
  overflow: hidden;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}
.next-class-card:hover {
  box-shadow: var(--shadow-md);
  transform: translateY(-1px);
}
.next-class-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
}
.next-class-title-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  font-weight: 700;
  color: var(--brand);
}
.next-class-status-badge {
  padding: 3px 10px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 700;
  background: var(--surface);
  color: var(--ink);
  border: 1px solid var(--line2);
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.next-class-status-badge.now {
  background: #dc2626;
  color: #fff;
  border-color: #dc2626;
  animation: pulseNow 1.8s infinite;
}
.next-class-status-badge.soon {
  background: #ea580c;
  color: #fff;
  border-color: #ea580c;
}
@keyframes pulseNow {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.75; }
}
.next-class-main {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 14px;
}
.next-class-info h3 {
  font-size: 18px;
  font-weight: 700;
  color: var(--ink);
  line-height: 1.4;
}
.next-class-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 16px;
  font-size: 13px;
  color: var(--mute);
  margin-top: 4px;
}
.next-class-meta span {
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.next-class-timer {
  font-size: 13.5px;
  font-weight: 600;
  color: var(--soft-ink);
  margin-top: 4px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.next-class-goto {
  flex-shrink: 0;
}

/* ==========================================================================
   Main Content & Lecture Cards
   ========================================================================== */
main {
  padding-block: 16px 80px;
}
.results-info {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-inline: 4px;
  margin-bottom: 8px;
  font-size: 13px;
  color: var(--mute);
}
.group {
  margin-top: 24px;
}
.group:first-child { margin-top: 8px; }
.group-h {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
  padding: 0 4px 10px;
}
.group-h-title {
  display: flex;
  align-items: center;
  gap: 8px;
}
.group-h h2 {
  font-size: 17px;
  font-weight: 700;
  color: var(--ink);
}
.group-h span {
  font-size: 13px;
  color: var(--mute);
  font-weight: 500;
}

.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
  contain: layout style paint;
}

/* Individual Lecture Card (with micro-interactions) */
.lec {
  position: relative;
  padding: 16px 20px;
  border-top: 1px solid var(--line);
  transition: transform 150ms ease, box-shadow 150ms ease, background-color 150ms ease;
  cursor: pointer;
  content-visibility: auto;
  contain-intrinsic-size: 0 140px;
}
.lec:first-child { border-top: 0; }
.lec:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-hover);
  background-color: color-mix(in srgb, var(--surface) 97%, var(--brand));
}
.lec::before {
  content: "";
  position: absolute;
  inset-block: 0;
  inset-inline-start: 0;
  width: 3px;
  background: var(--tc);
  transition: width 150ms ease;
}
.lec:hover::before {
  width: 5px;
}
.lec-head {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  align-items: flex-start;
}
.lec-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12.5px;
  font-weight: 700;
  color: var(--tc);
}
.ctx {
  color: var(--mute-soft);
  font-weight: 500;
  margin-inline-start: 6px;
}
.lec-title {
  font-size: 17px;
  font-weight: 600;
  line-height: 1.55;
  margin-top: 4px;
  color: var(--ink);
}
.lec-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 18px;
  font-size: 13px;
  color: var(--mute);
  margin-top: 4px;
}
.lec-meta span {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

/* Target Card Flash Highlight on Go To */
@keyframes cardPulseHighlight {
  0% { box-shadow: 0 0 0 4px var(--brand); }
  50% { box-shadow: 0 0 0 1px transparent; }
  100% { box-shadow: 0 0 0 4px var(--brand); }
}
.lec.highlight-pulse {
  animation: cardPulseHighlight 0.7s ease 3;
}

/* Resources Chips (with micro-interactions) */
.res {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 14px;
}
.chip {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  height: 35px;
  padding-inline: 12px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 600;
  background: var(--soft);
  color: var(--soft-ink);
  transition: transform 150ms ease, box-shadow 150ms ease, border-color 150ms ease;
  user-select: none;
  border: 1px solid transparent;
}
a.chip:hover {
  transform: translateY(-1px);
  border-color: var(--brand);
  box-shadow: var(--shadow-sm);
}
button.chip.off {
  background: none;
  color: var(--mute-soft);
  border: 1px dashed var(--line2);
  font-weight: 500;
  cursor: pointer;
  opacity: 0.75;
}
button.chip.off:hover {
  opacity: 1;
  border-color: var(--mute);
  background: rgba(0, 0, 0, 0.02);
}
.chip.book {
  background: none;
  border: 1px solid var(--line2);
  color: var(--ink);
}
.chip.book:hover {
  border-color: var(--brand);
  color: var(--brand);
  transform: translateY(-1px);
}

/* ==========================================================================
   Subject Accordion View (Redesigned with Grid & Clean Aesthetic)
   ========================================================================== */
.subj {
  margin-top: 12px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-inline-start: 4px solid var(--brand) !important;
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
  transition: border-inline-start-width 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
  content-visibility: auto;
  contain-intrinsic-size: 0 80px;
  contain: layout style;
}
.subj:hover {
  border-inline-start-width: 5px !important;
}

.subj > summary {
  display: grid;
  grid-template-columns: auto auto 1fr auto auto;
  align-items: center;
  gap: 12px;
  padding: 16px 18px;
  cursor: pointer;
  list-style: none;
  user-select: none;
  background: var(--surface);
  transition: background-color 0.15s ease;
}
.subj > summary::-webkit-details-marker { display: none; }
.subj > summary:hover {
  background: color-mix(in srgb, var(--brand) 4%, var(--surface));
}
.subj[open] > summary {
  position: sticky;
  top: 0;
  z-index: 5;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  box-shadow: 0 2px 8px -2px rgba(0, 0, 0, 0.08);
}

/* Star Button before Icon */
.subj-star-btn {
  width: 28px;
  height: 28px;
  padding: 0;
  border: none;
  background: none;
  color: var(--mute);
  display: grid;
  place-items: center;
  border-radius: var(--radius-sm);
  cursor: pointer;
  flex: none;
  transition: color 0.15s ease, transform 0.15s ease;
}
.subj-star-btn:hover {
  color: #f5b400;
  background: var(--soft);
}
.subj-star-btn[aria-pressed="true"] {
  color: #f5b400;
}
.subj-star-btn svg {
  width: 20px;
  height: 20px;
}

/* Subject Icon Badge (Specialized & High Contrast) */
.subj-icon {
  width: 38px;
  height: 38px;
  padding: 7px;
  border-radius: var(--radius-sm);
  background: color-mix(in srgb, var(--brand) 12%, var(--surface));
  border: 1px solid color-mix(in srgb, var(--brand) 24%, transparent);
  color: var(--brand);
  flex: none;
  box-sizing: border-box;
  transition: transform 0.2s ease, background-color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
}
.subj:hover .subj-icon {
  transform: scale(1.05);
  background: color-mix(in srgb, var(--brand) 18%, var(--surface));
  border-color: var(--brand);
  box-shadow: 0 0 12px color-mix(in srgb, var(--brand) 25%, transparent);
}

/* Info Column */
.subj-t {
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.subj-n {
  font-size: 16px;
  font-weight: 600;
  color: var(--ink);
  line-height: 1.4;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.subj-types {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin-top: 2px;
}
.stype {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 13px;
  font-weight: 500;
  color: var(--mute);
}
.stype-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--brand);
  display: inline-block;
  flex: none;
}

/* Quick Preview (Below Types) */
.subj-preview {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 12.5px;
  color: color-mix(in srgb, var(--mute) 80%, transparent);
  margin-top: 4px;
}
.preview-clock {
  width: 12px;
  height: 12px;
  color: var(--mute);
  flex: none;
}
.subj[open] .subj-preview {
  display: none !important;
}

/* Unified Count Badge (Consistent & Clean) */
.subj-count {
  height: 24px;
  padding-inline: 10px;
  border-radius: 12px;
  background: var(--soft);
  color: var(--soft-ink);
  font-size: 12px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  white-space: nowrap;
  flex: none;
}

/* Chevron */
.subj .chev {
  width: 18px;
  height: 18px;
  color: var(--mute);
  transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  flex: none;
}
.subj[open] .chev {
  transform: rotate(180deg);
}

/* Mobile responsiveness */
@media (max-width: 640px) {
  .subj > summary {
    grid-template-columns: auto auto 1fr auto auto;
    gap: 8px;
    padding: 12px 14px;
  }
  .subj-icon {
    width: 32px;
    height: 32px;
    padding: 6px;
  }
  .subj-n {
    font-size: 15px;
    white-space: normal;
  }
  .subj-count {
    padding-inline: 7px;
    font-size: 11px;
    height: 22px;
  }
}

/* Subject Books Bar */
.subj-books {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  padding: 10px 20px;
  background: color-mix(in srgb, var(--surface) 94%, var(--soft));
  border-bottom: 1px solid var(--line);
  border-inline-start: 4px solid var(--brand);
}
.subj-books-title {
  font-size: 12.5px;
  font-weight: 700;
  color: var(--ink);
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.subj-books a {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 30px;
  padding-inline: 11px;
  border-radius: var(--radius-sm);
  font-size: 12px;
  font-weight: 600;
  background: var(--surface);
  color: var(--ink);
  border: 1px solid var(--line2);
  transition: all 0.15s ease;
}
.subj-books a:hover {
  border-color: var(--brand);
  color: var(--brand);
  transform: translateY(-1px);
}

/* ==========================================================================
   Skeleton Cards & Loading State (Matching Real Card Dimensions)
   ========================================================================== */
.skel-wrap {
  display: grid;
  gap: 16px;
  padding-top: 12px;
}
.skel-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 16px 20px;
  position: relative;
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}
.skel-card::before {
  content: "";
  position: absolute;
  inset-block: 0;
  inset-inline-start: 0;
  width: 4px;
  background: var(--line2);
}
.skel-line {
  height: 14px;
  border-radius: 6px;
  background: var(--line);
  position: relative;
  overflow: hidden;
}
.skel-line::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--line2) 50%, transparent), transparent);
  animation: skel-shimmer 1.5s ease-in-out infinite;
}
@keyframes skel-shimmer {
  0% { transform: translateX(100%); }
  100% { transform: translateX(-100%); }
}
.skel-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}
.skel-tag { width: 95px; height: 16px; }
.skel-btn { width: 34px; height: 34px; border-radius: var(--radius-sm); }
.skel-title { width: 68%; height: 20px; margin-bottom: 12px; }
.skel-meta { display: flex; gap: 16px; width: 45%; height: 14px; margin-bottom: 18px; }
.skel-chips { display: flex; gap: 8px; }
.skel-chip { width: 110px; height: 34px; border-radius: var(--radius-sm); }

/* ==========================================================================
   Enhanced Empty States with Large Inline SVG Illustrations (80x80)
   ========================================================================== */
.empty {
  text-align: center;
  padding: 56px 24px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  margin-top: 16px;
}
.empty-illustration {
  width: 80px;
  height: 80px;
  margin-inline: auto;
  margin-bottom: 18px;
  color: var(--mute);
  opacity: 0.55;
  display: grid;
  place-items: center;
}
.empty-illustration svg {
  width: 80px;
  height: 80px;
}
.empty b {
  display: block;
  font-size: 16.5px;
  font-weight: 700;
  color: var(--ink);
}
.empty p {
  color: var(--mute);
  margin: 6px auto 20px;
  max-width: 440px;
  font-size: 14px;
  line-height: 1.6;
}
.empty-acts {
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
}

/* ==========================================================================
   Toast Notification (Fade + Slide above bottom area)
   ========================================================================== */
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(28px + env(safe-area-inset-bottom, 0px));
  transform: translate(-50%, 14px) scale(0.96);
  max-width: 90%;
  background: var(--ink);
  color: var(--bg);
  padding: 12px 20px;
  border-radius: var(--radius-md);
  font-size: 14px;
  font-weight: 500;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease, transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  z-index: 50;
  box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.35);
  display: flex;
  align-items: center;
  gap: 8px;
}
.toast.show {
  opacity: 1;
  transform: translate(-50%, 0) scale(1);
}

/* Floating Back to Top Button (Fade + Slide, Fixed Bottom Right in RTL) */
.back-to-top {
  position: fixed;
  bottom: calc(28px + env(safe-area-inset-bottom, 0px));
  inset-inline-end: 24px;
  width: 46px;
  height: 46px;
  border-radius: 50%;
  background: var(--surface);
  color: var(--ink);
  border: 1px solid var(--line2);
  box-shadow: var(--shadow-md);
  display: grid;
  place-items: center;
  z-index: 40;
  opacity: 0;
  pointer-events: none;
  transform: translateY(14px);
  transition: opacity 0.2s ease, transform 0.2s ease, background-color 0.15s, border-color 0.15s;
}
.back-to-top.visible {
  opacity: 1;
  pointer-events: auto;
  transform: translateY(0);
}
.back-to-top:hover {
  background: var(--soft);
  color: var(--brand);
  border-color: var(--brand);
}

/* ==========================================================================
   Responsive & Accessibility Adaptations
   ========================================================================== */
@media (min-width: 640px) {
  h1 { font-size: 30px; }
  .mast { padding-top: 40px; }
  .lec-head { gap: 16px; }
}

@media (max-width: 768px) {
  /* Disable stagger animation and GPU-heavy card transitions on mobile */
  .view-card-anim {
    animation: none !important;
    will-change: auto !important;
    opacity: 1 !important;
    transform: none !important;
  }
  .lec, .subj, .chip, .pill, .btn, .stat-item {
    transition-duration: 0.1s !important;
  }
  .lec:hover, .subj:hover {
    transform: none !important;
    box-shadow: var(--shadow-sm) !important;
  }
  .lec:hover::before {
    width: 3px !important;
  }
  .stat-item:hover {
    transform: none !important;
  }
}

@media (max-width: 640px) {
  .week-toggle-btn { display: inline-flex; }
  .weeks-collapsible.is-collapsed {
    display: none;
  }
  .days { font-size: 12.5px; }
  .day { height: 38px; }
  .res { gap: 6px; }
  .chip { height: 32px; font-size: 12px; padding-inline: 10px; }
  .next-class-main { flex-direction: column; }
  .next-class-goto { width: 100%; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    transition-duration: 0.01ms !important;
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;
  }
  .bg-mesh, .bg-grid, .adhkar-track {
    animation: none !important;
  }
}
</style>

  }

const cache = {
  get: k => {
    try {
      const item = JSON.parse(sessionStorage.getItem(k));
      if (!item || !item.t || !item.d) return null;
      if (Date.now() - item.t > CONFIG.CACHE_TTL) {

const currentDayIndex = new Date().getDay();

/**
 * Resolves the academic semester start date, auto-aligning year with device clock.
 * @returns {Date}
 */
function getEffectiveSemesterStart() {
  const now = new Date();
  const currentYear = now.getFullYear();
  let start = new Date(CONFIG.TERM_START_DATE || CONFIG.SEMESTER_START || `${currentYear}-09-19`);
  if (isNaN(start.getTime())) {
    start = new Date(`${currentYear}-09-19`);
  }
  // Auto-align year with device clock if configured year is in the past
  if (start.getFullYear() < currentYear) {
    start.setFullYear(currentYear);
  }
  // In first half of calendar year (Jan-June), first semester started previous fall
  if (now.getMonth() < 6 && start.getMonth() >= 7) {
    start.setFullYear(currentYear - 1);
  }
  return start;
}

const toArNum = n => new Intl.NumberFormat('ar-EG').format(n);

/**
 * Formats a Date object into Arabic readable string (e.g. ٢٧ سبتمبر).
 * @param {Date} date
 * @returns {string}
 */
function formatArabicDate(date) {
  try {
    return new Intl.DateTimeFormat('ar-EG', { day: 'numeric', month: 'short' }).format(date);
  } catch (e) {
    return `${date.getDate()} / ${date.getMonth() + 1}`;
  }
}

/**
 * Resolves current device day name and formatted Arabic date.
 */
function getDeviceTodayInfo() {
  const now = new Date();
  const dayNames = ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
  const dayName = dayNames[now.getDay()];
  const formattedDate = formatArabicDate(now);
  const isWeekend = now.getDay() === 4 || now.getDay() === 5; // Thu or Fri
  const statusNote = isWeekend ? 'عطلة أسبوعية' : 'يوم دراسي';
  
  return {
    dayName,
    formattedDate,
    text: `${dayName}، ${formattedDate} (${statusNote})`,
    shortText: `${dayName}، ${formattedDate}`,
    isWeekend
  };
}

/**
 * Calculates live semester status based on device calendar and clock.
 */
function getTermStatus() {
  const now = new Date();
  const start = getEffectiveSemesterStart();
  const todayMid = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const startMid = new Date(start.getFullYear(), start.getMonth(), start.getDate());
  const diffDays = Math.round((todayMid - startMid) / (1000 * 60 * 60 * 24));

  let currentWeek = 1;
  let elapsedWeeks = 0;
  let statusText = '';
  let isBeforeTerm = false;
  let isAfterTerm = false;
  let isUpcomingWeek = false;

  if (diffDays < 0) {
    currentWeek = 1;
    elapsedWeeks = 0;
    isBeforeTerm = true;
    const daysUntil = Math.abs(diffDays);
    if (daysUntil === 1) {
      statusText = `يبدأ الأسبوع ١ غداً (${formatArabicDate(start)})`;
    } else {
      statusText = `يبدأ الأسبوع ١ خلال ${toArNum(daysUntil)} أيام (${formatArabicDate(start)})`;
    }
  } else {
    // 7-day academic cycle starting on Saturday
    const completedCycles = Math.floor(diffDays / 7);
    const dayInCycle = ((diffDays % 7) + 7) % 7; // 0: Sat, 1: Sun, 2: Mon, 3: Tue, 4: Wed, 5: Thu, 6: Fri

    if (dayInCycle === 5 || dayInCycle === 6) {
      // Thursday or Friday: this week's lectures are completed! Preparing for next week starting Saturday.
      elapsedWeeks = completedCycles + 1;
      currentWeek = completedCycles + 2;
      isUpcomingWeek = true;
      const nextWeekStart = new Date(start.getTime() + (currentWeek - 1) * 7 * 24 * 60 * 60 * 1000);
      const daysUntilNext = 7 - dayInCycle; // 2 on Thu, 1 on Fri
      if (daysUntilNext === 1) {
        statusText = `الأسبوع ${toArNum(currentWeek)} (يبدأ غداً السبت ${formatArabicDate(nextWeekStart)})`;
      } else {
        statusText = `الأسبوع ${toArNum(currentWeek)} (يبدأ السبت ${formatArabicDate(nextWeekStart)})`;
      }
    } else {
      // Saturday to Wednesday: actively in the study week
      elapsedWeeks = completedCycles;
      currentWeek = completedCycles + 1;
      statusText = `الأسبوع ${toArNum(currentWeek)} من ${toArNum(CONFIG.WEEKS)}`;
    }

    if (elapsedWeeks >= CONFIG.WEEKS) {
      currentWeek = CONFIG.WEEKS;
      elapsedWeeks = CONFIG.WEEKS;
      isAfterTerm = true;
      isUpcomingWeek = false;
      statusText = `الترم انتهى ✓`;
    }
  }

  currentWeek = Math.min(CONFIG.WEEKS, Math.max(1, currentWeek));
  elapsedWeeks = Math.min(CONFIG.WEEKS, Math.max(0, elapsedWeeks));

  return {
    now,
    start,
    diffDays,
    currentWeek,
    elapsedWeeks,
    remainingWeeks: Math.max(0, CONFIG.WEEKS - elapsedWeeks),
    statusText,
    isBeforeTerm,
    isAfterTerm,
    isUpcomingWeek
  };
}

/**
 * Calculates current semester week index.
 * @returns {number} 1..14
 */
function getCurrentWeek() {
  return getTermStatus().currentWeek;
}

function calculateCurrentSemesterWeek() {

}

/**
 * Gets starting date of a specific semester week.
 * @param {number} weekNumber
 * @returns {Date}
 */
function getWeekDate(weekNumber) {
  const start = getEffectiveSemesterStart();
  return new Date(start.getTime() + (weekNumber - 1) * 7 * 24 * 60 * 60 * 1000);
}

    // Update term week text

    if (statWeekText) {
      if (term.isBeforeTerm) {
        statWeekText.innerHTML = `<b>${term.statusText}</b> <span style="display:inline-block;margin:0 4px;opacity:0.6;">•</span> <small style="font-size:11px;font-weight:600;opacity:0.9;">(انقضى ٠ أسبوع • متبقي ${toArNum(CONFIG.WEEKS)})</small>`;
      } else if (term.isAfterTerm) {
        statWeekText.innerHTML = `<b>الترم انتهى ✓</b> <span style="display:inline-block;margin:0 4px;opacity:0.6;">•</span> <small style="font-size:11px;font-weight:600;opacity:0.9;">(انقضت جميع الأسابيع الـ ${toArNum(CONFIG.WEEKS)})</small>`;
      } else {

      }
    }

    // Update progress bar
    const fill = $('termProgressFill');
    const bar = $('termProgress');
    const pct = term.isBeforeTerm ? 7.14 : (term.isAfterTerm ? 100 : ((term.currentWeek / CONFIG.WEEKS) * 100).toFixed(1));

      bar.setAttribute('title', `تقدم الترم: ${term.statusText} • انقضى ${term.elapsedWeeks} أسبوع (${pct}%)`);
    }
  } catch (e) {}
}

  const cleaned = (key || '').trim().toLowerCase();
  const valid = CONFIG.DAYS.map(d => d.k);
  if (valid.includes(cleaned)) return cleaned;
  // Fallback synonyms if sheet has variations
  const map = {
    'saturday': 'sat', 'السبت': 'sat',
    'sunday': 'sun', 'الأحد': 'sun',
    'monday': 'mon', 'الإثنين': 'mon', 'الاثنين': 'mon',
    'tuesday': 'tue', 'الثلاثاء': 'tue',
    'wednesday': 'wed', 'الأربعاء': 'wed', 'الاربعاء': 'wed'
  };
  return map[cleaned] || 'other';
}

/**
 * Parses time range string (e.g., "10:00 - 12:00" or "01:00 - 03:00") into 24-hour start/end.
 * @param {string} str
 */
function parseTimeRange(str) {
  if (!str) return null;
  const m = str.match(/(\d{1,2}):(\d{2})\s*[-–—]\s*(\d{1,2}):(\d{2})/);
  if (!m) return null;

  let sH = parseInt(m[1], 10);
  const sM = parseInt(m[2], 10);
  let eH = parseInt(m[3], 10);
  const eM = parseInt(m[4], 10);

  // University schedule 24-hour adjustment: 1..7 PM -> +12
  if (sH >= 1 && sH <= 7) sH += 12;
  if (eH >= 1 && eH <= 7) eH += 12;
  if (eH < sH) eH += 12;

  return { sH, sM, eH, eM };
}

// ==========================================================================
// 5. DATA FETCHING (Progressive, Abortable JSONP)
// ==========================================================================

/**
 * Fetches a single week's data with support for AbortSignal & Timeout.
 * @param {number} n Week number (1-14)
 * @param {AbortSignal} [signal] Optional abort signal
 * @returns {Promise<Array|null>}
 */
function fetchWeek(n, signal) {
  const cacheKey = 'ptw_' + n;
  const cached = cache.get(cacheKey);
  if (cached) return Promise.resolve(cached);

  if (signal && signal.aborted) {
    return Promise.resolve(null);
  }

  return new Promise(resolve => {
    const cb = 'gviz_cb_' + n + '_' + Math.random().toString(36).substring(2, 8);
    const sheetName = 'Week ' + String(n).padStart(2, '0');
    const script = document.createElement('script');

    let completed = false;
    const cleanup = () => {
      completed = true;
      if (window[cb]) delete window[cb];
      if (script.parentNode) script.remove();
      if (signal) signal.removeEventListener('abort', onAbort);
    };

    const onAbort = () => {
      if (!completed) {
        cleanup();
        resolve(null);
      }
    };

    if (signal) {
      signal.addEventListener('abort', onAbort);
    }

    const timeout = setTimeout(() => {
      if (!completed) {
        cleanup();
        resolve(null);
      }
    }, 12000);

    window[cb] = function(resp) {
      clearTimeout(timeout);
      if (completed) return;
      try {
        const rows = ((resp && resp.table && resp.table.rows) || []).map((row, rowIdx) => {
          const c = row.c || [];
          const v = i => (c[i] && c[i].v != null) ? String(c[i].v).trim() : '';
          const rawDay = v(0);
          const rawKey = v(10) || rawDay;
          return {
            id: `lec-${n}-${rowIdx}`,
            wk: n,
            day: rawDay,
            subject: v(1),
            type: v(2),
            place: v(3),
            time: v(4),
            audio: v(5),
            pdf: v(6),
            summary: v(7),
            transcript: v(8),
            quiz: v(9),
            dayKey: validateDayKey(rawKey)
          };
        }).filter(x => {
          const s = (x.subject || '').trim().toLowerCase();
          // Exclude header rows and empty records
          return s && s !== 'المادة (subject)' && s !== 'المادة' && s !== 'غير محدد' && s !== 'بدون مادة' && s !== 'undefined' && s !== '-';
        });

        cache.set(cacheKey, rows);
        cleanup();
        resolve(rows);
      } catch (err) {
        cleanup();
        resolve(null);
      }
    };

    script.onerror = function() {
      clearTimeout(timeout);
      cleanup();
      resolve(null);
    };

    const params = new URLSearchParams({
      sheet: sheetName,
      tqx: `responseHandler:${cb}`
    });
    script.src = `https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/gviz/tq?${params.toString()}`;
    document.body.appendChild(script);
  });
}

/**
 * Background worker to fetch remaining weeks with concurrency limit (2-3).
 */
function processBackgroundQueue() {
  if (isBackgroundQueueRunning || !backgroundFetchQueue.length) return;
  isBackgroundQueueRunning = true;

  const runBatch = () => {
    if (!backgroundFetchQueue.length) {
      isBackgroundQueueRunning = false;
      return;
    }

    const batch = backgroundFetchQueue.splice(0, CONFIG.CONCURRENT_FETCHES);
    const promises = batch.map(w => fetchWeek(w));

    Promise.all(promises).then(results => {
      let hasNew = false;
      results.forEach((wData, idx) => {
        if (wData && wData.length) {
          const wNum = batch[idx];
          ALL = [...ALL.filter(x => x.wk !== wNum), ...wData];
          hasNew = true;
        }
      });

      if (hasNew) {
        renderStats();
        updateTodayBadge();
        updateNextClassCard();
        // If current view is subject or current week matches, re-render
        if (st.view === 'subject' || batch.includes(st.week)) {
          render(false);
        }
      }

      // Schedule next batch on idle (fallback: setTimeout)
      if (typeof window.requestIdleCallback === 'function') {
        window.requestIdleCallback(runBatch);
      } else {
        setTimeout(runBatch, 300);
      }
    });
  };

  runBatch();
}

/**
 * Loads the current week first, then queues remaining weeks progressively.
 * @param {boolean} [force=false]
 */
async function loadAll(force = false) {
  if (force) {
    cache.clear();
    ALL = [];
    backgroundFetchQueue = [];
    isBackgroundQueueRunning = false;
  }

  $('loading').hidden = false;

  // Cancel any pending fetch for active week
  if (pendingControllers.has(st.week)) {
    pendingControllers.get(st.week).abort();
  }
  const ctrl = new AbortController();
  pendingControllers.set(st.week, ctrl);

  const currentData = await fetchWeek(st.week, ctrl.signal);
  pendingControllers.delete(st.week);

  if (currentData && currentData.length) {
    ALL = [...ALL.filter(x => x.wk !== st.week), ...currentData];
  }

  $('loading').hidden = true;
  renderStats();
  updateTodayBadge();
  updateNextClassCard();
  render(false);

  // Queue remaining weeks to be loaded in background
  backgroundFetchQueue = Array.from({ length: CONFIG.WEEKS }, (_, i) => i + 1)
    .filter(n => n !== st.week && !ALL.some(x => x.wk === n));

  processBackgroundQueue();
}

/**
 * Evaluates if a lecture matches active filters.
 * @param {Object} it Lecture record
 * @param {boolean} [ignoreDay=false] Whether to ignore day filter
 */
function matches(it, ignoreDay = false) {
  if (st.type !== 'all' && it.type !== st.type) return false;
  for (const r of st.res) {
    if (!isUrl(it[r])) return false;
  }
  if (!ignoreDay && st.view === 'week' && st.day !== 'all' && it.dayKey !== st.day) return false;
  if (st.q) {
    const hay = `${it.subject} ${it.place} ${it.day} ${it.type}`.toLowerCase();
    if (!hay.includes(st.q.toLowerCase())) return false;
  }
  return true;
}

const hasActiveFilters = () => Boolean(st.q || st.type !== 'all' || st.res.size || (st.view === 'week' && st.day !== 'all'));

// ==========================================================================
// 7. FEATURE: NEXT CLASS CALCULATOR ("المحاضرة القادمة")
// ==========================================================================

/**
 * Computes the nearest upcoming lecture in the next 7 days.
 */
function getNearestUpcomingLecture() {
  if (!ALL.length) return null;

  const now = new Date();
  const currentWeek = CURRENT_SEMESTER_WEEK;

  // Day of week index mapping: 0:Sun, 1:Mon, 2:Tue, 3:Wed, 6:Sat
  const dayKeyToDayNum = {
    'sun': 0, 'mon': 1, 'tue': 2, 'wed': 3, 'sat': 6
  };

  const candidates = [];

  // Search current week and next week
  [currentWeek, currentWeek + 1].forEach(wNum => {
    if (wNum > CONFIG.WEEKS) return;
    const weekLectures = ALL.filter(x => x.wk === wNum);

    weekLectures.forEach(lec => {
      const targetDayNum = dayKeyToDayNum[lec.dayKey];
      if (targetDayNum === undefined) return;

      const timeRange = parseTimeRange(lec.time);
      if (!timeRange) return;

      // Calculate candidate Date
      const candDate = new Date(now);
      candDate.setSeconds(0, 0);

      // Days difference to target day
      let dayDiff = (targetDayNum - now.getDay());
      if (wNum > currentWeek) {
        dayDiff += 7;
      } else if (dayDiff < 0) {
        // Day already passed in current week
        return;
      }

      candDate.setDate(now.getDate() + dayDiff);
      candDate.setHours(timeRange.sH, timeRange.sM, 0, 0);

      const endDate = new Date(candDate);
      endDate.setHours(timeRange.eH, timeRange.eM, 0, 0);

      // Check if already finished
      if (now > endDate) return;

      const msUntilStart = candDate - now;
      const msUntilEnd = endDate - now;

      // Only within 7 days
      if (msUntilStart > 7 * 24 * 60 * 60 * 1000) return;

      candidates.push({
        lec,
        candDate,
        endDate,
        msUntilStart,
        msUntilEnd,
        isNow: msUntilStart <= 0 && msUntilEnd > 0,
        isSoon: msUntilStart > 0 && msUntilStart <= 60 * 60 * 1000
      });
    });
  });

  if (!candidates.length) return null;

  // Sort by earliest start time (or ongoing first)
  candidates.sort((a, b) => {
    if (a.isNow && !b.isNow) return -1;
    if (!a.isNow && b.isNow) return 1;
    return a.candDate - b.candDate;
  });

  return candidates[0];
}

    `<span class="adhkar-item">${text}</span><span class="adhkar-sep" aria-hidden="true">۞</span>`

  track.innerHTML = buildItems() + buildItems();

function getNextLectureForSubject(subject) {
  const rows = ALL.filter(it => it.subject === subject);
  if (!rows.length) return null;

  const curWkRows = rows.filter(r => r.wk === CURRENT_SEMESTER_WEEK);

/**

/**
 * Toggles favorite state for a subject, plays animation, updates storage and UI.
 * @param {string} subject
 * @param {HTMLElement} [triggerBtn]
 */
function toggleFavorite(subject, triggerBtn) {
  if (!subject) return;
  const isNowFav = !st.favs.has(subject);
  if (isNowFav) {
    st.favs.add(subject);
    toast(`تمت إضافة "${subject}" للمفضلة ⭐`);
  } else {
    st.favs.delete(subject);
    toast(`تمت إزالة "${subject}" من المفضلة`);
  }

  // Persist to localStorage
  store.set('pt_favorites', JSON.stringify(Array.from(st.favs)));
  updateFavBadge();

  // If a trigger button is provided, play target animation
  if (triggerBtn) {
    triggerBtn.setAttribute('aria-pressed', String(isNowFav));
    triggerBtn.setAttribute('aria-label', isNowFav ? `إزالة ${subject} من المفضلة` : `أضف ${subject} للمفضلة`);
    triggerBtn.classList.remove('anim-add', 'anim-rem');
    void triggerBtn.offsetWidth;
    triggerBtn.classList.add(isNowFav ? 'anim-add' : 'anim-rem');
    const useEl = triggerBtn.querySelector('use');
    if (useEl) {
      useEl.setAttribute('href', isNowFav ? '#i-star-filled' : '#i-star');
    }
  }

  // Sync other favorite buttons for the same subject
  document.querySelectorAll(`.fav-btn[data-subj="${CSS.escape(subject)}"]`).forEach(btn => {
    if (btn !== triggerBtn) {
      btn.setAttribute('aria-pressed', String(isNowFav));
      btn.setAttribute('aria-label', isNowFav ? `إزالة ${subject} من المفضلة` : `أضف ${subject} للمفضلة`);
      const u = btn.querySelector('use');
      if (u) u.setAttribute('href', isNowFav ? '#i-star-filled' : '#i-star');
    }
  });

  // If in favorites view, re-render view
  if (st.view === 'favs') {
    renderFavs();
  }
}

/**
 * Updates dynamic counter for results header.
 * @param {number} count
 */
function updateResultsCount(count) {
  const el = $('resultsCount');
  if (!el) return;
  if (!$('loading').hidden && ALL.length === 0) {
    el.textContent = 'جارٍ تحميل المحاضرات…';
    return;
  }
  if (count === 0) {
    el.textContent = 'لا توجد نتائج';
  } else if (count === 1) {
    el.textContent = 'محاضرة واحدة';
  } else if (count === 2) {
    el.textContent = 'محاضرتان';
  } else if (count >= 3 && count <= 10) {
    el.textContent = `${count} محاضرات`;
  } else {
    el.textContent = `${count} محاضرة`;
  }
}

/**
 * Renders the Week View with days groupings.
 */
function renderWeek() {
  document.querySelectorAll('.wk').forEach(b => {
    const isCur = +b.dataset.w === st.week;
    b.setAttribute('aria-pressed', String(isCur));
    b.setAttribute('aria-current', isCur ? 'page' : 'false');
  });

  document.querySelectorAll('.day').forEach(b => {
    const isSel = b.dataset.d === st.day;
    b.setAttribute('aria-pressed', String(isSel));
    b.setAttribute('aria-selected', String(isSel));
  });

  document.querySelector('.wk[aria-pressed="true"]')?.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });

  const items = ALL.filter(it => it.wk === st.week && matches(it));
  const root = $('content');
  updateResultsCount(items.length);

  if (!items.length) {
    root.innerHTML = emptyHTML();
    return;
  }

  // When a specific day is selected
  if (st.day !== 'all') {
    root.innerHTML = `<div class="panel">${items.map(it => cardHTML(it, '', true)).join('')}</div>`;
    return;
  }

  // Group by days
  const knownKeys = CONFIG.DAYS.map(d => d.k);
  const groups = CONFIG.DAYS.map(d => ({
    key: d.k,
    n: d.n,
    rows: items.filter(x => x.dayKey === d.k)
  }));

  const unassigned = items.filter(x => !knownKeys.includes(x.dayKey));
  if (unassigned.length) {
    groups.push({ key: 'other', n: 'أخرى (غير محدد)', rows: unassigned, isWarning: true });
  }

  root.innerHTML = groups.filter(g => g.rows.length).map(g => {
    const extra = g.rows[0].day && g.rows[0].day !== g.n && !g.isWarning ? g.rows[0].day : '';
    const warningIcon = g.isWarning ? `<span style="color:var(--t-hospital)" title="اليوم غير مسجل بدقة في الشيت">${ic('alert')}</span>` : '';
    return `<section class="group" aria-label="${g.n}">
      <div class="group-h">
        <div class="group-h-title">
          <h2>${g.n}</h2>
          ${warningIcon}
        </div>
        <span>${extra ? esc(extra) + '، ' : ''}${g.rows.length} محاضرة</span>
      </div>
      <div class="panel">${g.rows.map(it => cardHTML(it, '', true)).join('')}</div>
    </section>`;
  }).join('');
}

/**
 * Renders the Subject View with accordion details and distinct color accents.
 */
function renderSubjects() {
  const bySubject = {};
  ALL.filter(it => matches(it, true)).forEach(it => {
    (bySubject[it.subject] ??= []).push(it);
  });

  const subjects = Object.keys(bySubject).sort((a, b) => a.localeCompare(b, 'ar'));
  const root = $('content');
  const totalLectures = Object.values(bySubject).reduce((acc, cur) => acc + cur.length, 0);
  updateResultsCount(totalLectures);

  if (!subjects.length) {
    root.innerHTML = emptyHTML();
    return;
  }

  const openByDefault = Boolean(st.q || st.type !== 'all' || st.res.size);

  // Top action bar with Expand All & Collapse All buttons
  let topBarHtml = '';
  if (subjects.length > 3) {
    topBarHtml = `
      <div class="subj-actions-bar">
        <span>${subjects.length} مواد دراسية</span>

  }

  const listHtml = subjects.map(sub => {
    const rows = bySubject[sub].sort((a, b) => a.wk - b.wk);

    const bookTypes = Object.keys(books);

    const actualTypes = Array.from(new Set(rows.map(r => r.type).filter(Boolean)));

      return `<span class="stype"><i class="stype-dot"></i>${esc(t)}</span>`;

/**
 * Applies progressive stagger delay to lecture and subject cards.
 * @param {HTMLElement} container
 */
function applyStaggerAnimation(container) {
  if (!container) return;
  const cards = container.querySelectorAll('.lec, details.sub, details.fav-subj, .panel, .empty, .subj-actions-bar, .favs-top-bar');
  if (!cards.length) return;

  const maxDelay = 260; // Maximum stagger delay cap
  const step = Math.min(35, cards.length > 1 ? maxDelay / cards.length : 35);

  cards.forEach((card, idx) => {
    card.style.animationDelay = `${Math.round(idx * step)}ms`;
    card.classList.add('view-card-anim');
  });

  setTimeout(() => {
    cards.forEach(card => {
      card.classList.remove('view-card-anim');
      card.style.animationDelay = '';
    });
  }, 600);
}

/**
 * Executes a rendering pass with smooth Card Stagger and View Transition.
 * @param {Function} renderAction
 * @param {boolean} [scrollToTop=false]
 */
function renderWithTransition(renderAction, scrollToTop = false) {
  const content = $('content');
  if (!content) {
    renderAction();
    if (scrollToTop) toTop();
    return;
  }

  // 1. Smooth fade out of old content
  content.classList.add('view-fade-out');

  setTimeout(() => {
    // 2. Render new content & scroll
    renderAction();
    if (scrollToTop) toTop();

    // 3. Remove fade out & apply staggered entry animation to newly rendered cards
    content.classList.remove('view-fade-out');
    applyStaggerAnimation(content);
  }, 90);
}

function renderCore(scrollToTop = false) {
  // Persist session state
  store.set('pt_view', st.view);
  store.set('pt_week', String(st.week));
  store.set('pt_day', st.day);

  updateTermProgress();

  $('weekNav').hidden = st.view !== 'week';
  
  document.querySelectorAll('.viewBtn').forEach(b => {
    const isSel = b.dataset.view === st.view;
    b.setAttribute('aria-selected', String(isSel));
  });

  document.querySelectorAll('.day').forEach(b => {
    b.setAttribute('aria-selected', String(b.dataset.d === st.day));
  });

  const filterCount = (st.type !== 'all' ? 1 : 0) + st.res.size;
  const countEl = $('filterCount');
  countEl.hidden = !filterCount;
  countEl.textContent = filterCount;

  VIEW = [];
  if (st.view === 'week') renderWeek();
  else if (st.view === 'subject') renderSubjects();
  else if (st.view === 'favs') renderFavs();

  if (scrollToTop) toTop();
}

/**
 * Main application render function.
 * @param {boolean} [scrollToTop=false]
 * @param {boolean} [animate=null]
 */
function render(scrollToTop = false, animate = null) {
  const shouldAnimate = animate !== null ? animate : (scrollToTop === true);
  if (shouldAnimate) {
    renderWithTransition(() => renderCore(scrollToTop), scrollToTop);
  } else {
    renderCore(scrollToTop);
  }
}

/**
 * Copies structured lecture details with Week & Day to clipboard.
 * @param {Object} it
 */
function copyItem(it) {
  let text = `📌 *${it.subject}*\n`;
  text += `📅 الأسبوع ${it.wk} — ${it.day || ''} ${it.time || ''} (${it.type || ''})\n`;
  if (it.place) text += `📍 المكان: ${it.place}\n`;

  CONFIG.RES.forEach(r => {
    if (isUrl(it[r.k])) text += `🔗 ${r.l}: ${it[r.k]}\n`;
  });

  const bookUrl = getBookUrl(it.subject, it.type);
  if (bookUrl) text += `📚 كتاب المادة: ${bookUrl}\n`;

  const onSuccess = () => toast('تم نسخ تفاصيل المحاضرة للمشاركة بنجاح ✓');

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(onSuccess, fallbackCopy);
  } else {
    fallbackCopy();
  }

  function fallbackCopy() {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try {
      document.execCommand('copy');
      onSuccess();
    } catch (e) {
      toast('تعذّر النسخ التلقائي');
    }
    ta.remove();
  }
}

/**
 * Debounced week selection handler (200ms) with AbortController.
 */
let selectWeekTimer = null;
function selectWeek(weekNum) {
  if (st.week === weekNum) return;
  st.week = weekNum;
  store.set('pt_week', String(weekNum));

  document.querySelectorAll('.wk').forEach(b => {
    b.setAttribute('aria-pressed', String(parseInt(b.dataset.w, 10) === weekNum));
  });

  render(true);

  if (!ALL.some(x => x.wk === weekNum)) {
    clearTimeout(selectWeekTimer);
    selectWeekTimer = setTimeout(async () => {
      if (pendingControllers.has(weekNum)) {
        pendingControllers.get(weekNum).abort();
      }
      const ctrl = new AbortController();
      pendingControllers.set(weekNum, ctrl);

      $('loading').hidden = false;
      const wData = await fetchWeek(weekNum, ctrl.signal);
      pendingControllers.delete(weekNum);

      if (wData) {
        ALL = [...ALL.filter(x => x.wk !== weekNum), ...wData];
        renderStats();
        updateTodayBadge();
        updateNextClassCard();
      }
      $('loading').hidden = true;
      render(false);
    }, 200);
  }
}

}

// "محاضرات اليوم" (Today's Lectures Button) with Weekend Toast
$('todayBtn').onclick = () => {
  if (!TODAY_KEY) {
    toast('اليوم عطلة نهاية الأسبوع — عُرض جدول السبت');
    st.view = 'week';
    st.day = 'sat';
    store.set('pt_view', 'week');
    store.set('pt_day', 'sat');
    render(true);
    return;
  }

  st.view = 'week';
  st.day = TODAY_KEY;
  store.set('pt_view', 'week');
  store.set('pt_day', TODAY_KEY);
  render(true);
  toast(`محاضرات اليوم (${CONFIG.DAYS.find(d => d.k === TODAY_KEY)?.n || ''})`);
};

// Manual Refresh Button
$('refreshBtn').onclick = () => {
  toast('جارٍ تحديث البيانات من المصدر…');
  loadAll(true);
};


// Delegated Content Actions (Copy & Unavailable & Retries & Next Class Goto)
document.addEventListener('click', e => {
  // Favorite star button clicked
  const favBtn = e.target.closest('.fav-btn');
  if (favBtn) {
    e.preventDefault();
    e.stopPropagation();
    const subj = favBtn.dataset.subj;
    if (subj) toggleFavorite(subj, favBtn);
    return;
  }

  // Go to Next Class Action
  const gotoBtn = e.target.closest('[data-goto-lec]');
  if (gotoBtn) {
    const targetLecId = gotoBtn.dataset.gotoLec;
    const targetWk = parseInt(gotoBtn.dataset.wk, 10);
    const targetDay = gotoBtn.dataset.day;

    st.view = 'week';
    st.week = targetWk;
    st.day = targetDay;
    store.set('pt_view', 'week');
    store.set('pt_week', targetWk);
    render(false);

    // Scroll to the targeted card and pulse highlight
    setTimeout(() => {
      const card = document.getElementById(targetLecId);
      if (card) {
        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
        card.classList.remove('highlight-pulse');
        void card.offsetWidth;
        card.classList.add('highlight-pulse');
      }
    }, 150);
    return;
  }

  // Copy Button
  const copyBtn = e.target.closest('.copyBtn');
  if (copyBtn) {
    const card = copyBtn.closest('article');
    const idx = parseInt(card.dataset.i, 10);
    const item = VIEW[idx];
    if (item) copyItem(item);
    return;
  }

  // Unavailable resource clicked -> show informative toast
  const unavailChip = e.target.closest('[data-unavail]');
  if (unavailChip) {
    const label = unavailChip.dataset.unavail;
    toast(`ملف ${label} لم يتم رفعه بعد — تحقق لاحقاً`);
    return;
  }

  // Action buttons inside Empty State
  const actBtn = e.target.closest('[data-act]');
  if (actBtn) {
    const act = actBtn.dataset.act;
    if (act === 'clear') clearAllFilters();
    else if (act === 'retry') loadAll(true);
    else if (act === 'explore-subjects') {
      st.view = 'subject';
      store.set('pt_view', 'subject');
      render(true);
    } else if (act === 'clear-all-favs') {
      clearAllFavorites();
    } else if (act === 'expand-all') {
      toggleAllSubjects(true);
    } else if (act === 'collapse-all') {
      toggleAllSubjects(false);
    }
    else if (act === 'show-all-days') {
      st.day = 'all';
      render(true);
    }
  }
});

// Back to Top Button (Fade + Slide after 400px scroll)
const backToTopBtn = $('backToTop');
window.addEventListener('scroll', () => {
  if (window.scrollY > 400) {
    backToTopBtn.classList.add('visible');
  } else {
    backToTopBtn.classList.remove('visible');
  }
}, { passive: true });

backToTopBtn.onclick = toTop;

// Theme Toggle Button
$('themeBtn').onclick = () => {
  const current = document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light';
  applyTheme(current === 'dark' ? 'light' : 'dark', true);
};


// Scroll Position Persistence (Debounced)
window.addEventListener('scroll', () => {
  clearTimeout(window._scrollDebounce);
  window._scrollDebounce = setTimeout(() => {
    store.set('pt_scroll', String(window.scrollY));
  }, 300);
}, { passive: true });

// Initialize Application
applyTheme(document.documentElement.dataset.theme || 'light');
renderPills();
updateFavBadge();
render(false);
loadAll();
startNextClassTimer();
renderAdhkar();

// Restore previous session feedback
if (hasRestoredSession) {
  setTimeout(() => {
    const savedScroll = parseInt(store.get('pt_scroll', '0'), 10);
    if (savedScroll > 150) {
      window.scrollTo({ top: savedScroll, behavior: 'smooth' });
    }
    toast('تم استعادة آخر جلسة عمل ✓');
  }, 600);
}
</script>
</body>
</html>
